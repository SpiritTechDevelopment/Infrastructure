---
bootstrap_wireguard_interface: "{{ spiritvpn_node_plan.infrastructure.networking.management.interface }}"
bootstrap_wireguard_address: "{{ spiritvpn_node_plan.instance.management_address }}/32"
bootstrap_wireguard_network: "{{ spiritvpn_node_plan.instance.management_network }}"
bootstrap_wireguard_listen_port: "{{ spiritvpn_node_plan.infrastructure.networking.management.listen_port }}"
bootstrap_wireguard_mtu: "{{ spiritvpn_node_plan.infrastructure.networking.management.mtu }}"
bootstrap_wireguard_persistent_keepalive: "{{ spiritvpn_node_plan.infrastructure.networking.management.persistent_keepalive_seconds }}"
bootstrap_wireguard_hub_endpoint: ""
bootstrap_wireguard_hub_public_key: ""
bootstrap_wireguard_hub_management_address: ""
bootstrap_wireguard_private_key_path: "/etc/wireguard/{{ bootstrap_wireguard_interface }}.key"
bootstrap_wireguard_public_key_path: "/etc/wireguard/{{ bootstrap_wireguard_interface }}.pub"
bootstrap_wireguard_config_path: "/etc/wireguard/{{ bootstrap_wireguard_interface }}.conf"
bootstrap_wireguard_script_path: /usr/local/sbin/spiritvpn-configure-management-wireguard
bootstrap_wireguard_hub_peer_command: /usr/local/sbin/spiritvpn-wireguard-peer
# Сколько ждать, пока туннель сойдётся, прежде чем считать хаб недостижимым.
# Шесть попыток по пять секунд — это тридцать секунд сверх таймаута самого ping,
# с запасом больше, чем период повторного рукопожатия WireGuard.
bootstrap_wireguard_hub_ping_retries: 6
bootstrap_wireguard_hub_ping_delay_seconds: 5
