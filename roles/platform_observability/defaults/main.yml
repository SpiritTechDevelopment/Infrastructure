---
platform_observability_dir: /opt/spiritvpn/platform/observability
# Потолок на логи одного контейнера: max-size × max-file.
platform_observability_log_max_size: 10m
platform_observability_log_max_files: "5"
platform_observability_state_dir: /var/lib/spiritvpn/observability
# Where roles/control_observability writes file_sd fragments on the host, and
# where that directory appears inside the container. The skeleton config must
# reference the container path; the fragments are written to the host path.
platform_observability_targets_dir: /opt/spiritvpn/platform/observability/targets
platform_prometheus_targets_container_dir: /etc/prometheus/targets
# Public, reviewed supply-chain pin, updated through the normal pull-request
# flow exactly like platform_vault_image. Not a secret.
platform_prometheus_image: "docker.io/prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996"
# Upstream prom/prometheus runs as uid 65534 (nobody) and creates lock and
# chunk files in the TSDB directory at startup.
platform_prometheus_uid: "65534"
platform_prometheus_gid: "65534"
# Loopback only. Scraping is outbound, so a routable listener buys nothing and
# would expose fleet composition and traffic volumes; operators reach the UI
# through an SSH tunnel to the management host. This also sidesteps the fact
# that the hub holds one overlay address per environment while Prometheus can
# bind exactly one.
platform_prometheus_bind_address: 127.0.0.1
platform_prometheus_port: 9090
platform_prometheus_scrape_timeout_seconds: 10

# One shared instance serves both environments, the way one Vault does.
# Isolation is by write surface: each environment's control deployment writes
# only its own file_sd fragments under targets/<environment>/.
platform_observability_environments: [develop, prod]

# Retention and the scrape interval are shared because the TSDB is shared:
# Prometheus has no per-job retention. Both are asserted against each
# environment's desired state by roles/control_observability, so a divergence
# fails the deployment instead of silently ignoring desired state.
platform_prometheus_retention_days: 30
platform_prometheus_scrape_interval_seconds: 15

# Adding a scraped service is a skeleton change, and therefore a deliberate,
# reviewed platform deployment rather than a side effect of a fleet change.
platform_observability_jobs:
  - name: node-exporter
    path: /metrics
  - name: agent-metrics
    path: /metrics
  - name: backend-metrics
    path: /metrics
  - name: postgres-metrics
    path: /metrics

# Хаб собирал метрики со всего флота и не собирал их с себя: под нагрузкой
# оказывался невидим ровно тот хост, который держит Vault, коллектор и
# исполнителя. Скрап идёт по loopback с той же машины, поэтому цель объявлена
# статически в скелете, а не через file_sd: она не зависит от окружения и
# существует ровно одна.
#
# Образ и digest — те же, что у нод в desired/common/components.yml. Одна
# версия экспортера на весь контур означает, что запросы дашборда одинаково
# верны и для нод, и для хаба.
platform_node_exporter_image: "mirror.gcr.io/prom/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a"
platform_node_exporter_bind_address: 127.0.0.1
platform_node_exporter_port: 9100

# Grafana — единственная поверхность, где собранное видно глазами. Слушает
# только loopback по той же причине, что и коллектор: routable-слушатель на
# хосте с Vault публиковал бы состав флота и объёмы трафика. Доступ —
# SSH-туннелем на хаб.
platform_grafana_image: "mirror.gcr.io/grafana/grafana@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa"
# Upstream grafana/grafana работает под uid 472 и пишет в /var/lib/grafana.
platform_grafana_uid: "472"
platform_grafana_gid: "472"
platform_grafana_bind_address: 127.0.0.1
platform_grafana_port: 3000
# Литералом, а не ссылкой на platform_observability_dir: дефолты этой роли
# рендерятся в compose напрямую, и вложенный Jinja дал бы в YAML скаляр,
# начинающийся с фигурной скобки.
platform_grafana_dir: /opt/spiritvpn/platform/observability/grafana
platform_grafana_state_dir: /var/lib/spiritvpn/grafana
# Пароль администратора не живёт ни в репозитории, ни в SOPS-бандле: он нужен
# только для изменений через UI, а всё, что показывает Grafana, провижинится
# файлами. Генерируется один раз на хабе и лежит рядом с состоянием — тем же
# приёмом, что канонический /var/lib/xray/reality.key на ноде.
# Рядом с состоянием, а не внутри него: каталог состояния монтируется в
# контейнер на запись, и секрет оказался бы там вторым, писчим путём.
platform_grafana_admin_password_file: /var/lib/spiritvpn/grafana-admin-password
# Смотреть можно без учётной записи, менять — нет. Достаточно того, что до
# loopback хаба надо сначала дойти по SSH; но анонимный Admin отдал бы любому
# локальному процессу API создания источников данных, то есть исходящие запросы
# от имени хоста, на котором стоит Vault.
platform_grafana_anonymous_role: Viewer

# Сигнализация. Дашборд показывает, но не будит: пока никто не разбудит,
# наблюдаемость работает ровно в те минуты, когда оператор сам смотрит.
platform_alertmanager_image: "mirror.gcr.io/prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba"
# Upstream prom/alertmanager работает под uid 65534.
platform_alertmanager_uid: "65534"
platform_alertmanager_gid: "65534"
platform_alertmanager_bind_address: 127.0.0.1
platform_alertmanager_port: 9093
platform_alertmanager_dir: /opt/spiritvpn/platform/observability/alertmanager
platform_alertmanager_state_dir: /var/lib/spiritvpn/alertmanager
platform_prometheus_rules_dir: /opt/spiritvpn/platform/observability/rules
platform_prometheus_rules_container_dir: /etc/prometheus/rules
# Получатель приезжает из SOPS-бандла платформы вместе с остальными
# операторскими значениями: секрет, положенный руками на хаб, — это ровно то
# недекларированное состояние, из-за которого потом никто не знает, что там
# лежит и когда менялось.
#
# Пустые по умолчанию, чтобы отсутствие было видно ассертом, а не пустым
# получателем в работающем Alertmanager.
platform_alertmanager_telegram_bot_token: ""
platform_alertmanager_telegram_chat_id: ""
# Тема супергруппы, как у уведомлений о PR в SpiritVPN и NodeAgent. Пустая
# строка означает «без темы»; если чат не форум, message_thread_id Telegram
# отвергнет. Алертам стоит своя тема, а не общая лента с отчётами о сборках.
platform_alertmanager_telegram_thread_id: ""
# Как часто повторять напоминание о том, что уже горит.
platform_alertmanager_repeat_interval: 4h
