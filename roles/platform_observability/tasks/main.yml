---
- name: Validate the shared collector inputs
  ansible.builtin.assert:
    that:
      - >-
        platform_prometheus_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - platform_observability_environments | length > 0
      - platform_observability_jobs | length > 0
      - platform_prometheus_retention_days | int > 0
      - platform_prometheus_scrape_interval_seconds | int > 0
      # A routable listener would publish fleet composition and traffic volumes
      # from a host that already holds Vault. Scraping is outbound and needs no
      # inbound listener at all.
      - platform_prometheus_bind_address == '127.0.0.1'
      # Same reasoning for everything else on this host. Grafana renders fleet
      # composition and traffic volumes; the exporter publishes the hub's own
      # capacity. Neither has an inbound caller outside this machine.
      - platform_grafana_bind_address == '127.0.0.1'
      - platform_node_exporter_bind_address == '127.0.0.1'
      - >-
        platform_grafana_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        platform_node_exporter_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      # An anonymous Admin would hand the datasource API to any local process,
      # and a Grafana datasource is an outbound request made by the host that
      # holds Vault.
      - platform_grafana_anonymous_role in ['Viewer', 'None']
      - platform_alertmanager_bind_address == '127.0.0.1'
      - >-
        platform_alertmanager_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        platform_loki_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        platform_alloy_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      The shared observability inputs are incomplete, unpinned, or would expose
      the collector beyond loopback.

- name: Create the shared collector directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ platform_observability_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_observability_targets_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_observability_state_dir }}"
      owner: "{{ platform_prometheus_uid }}"
      group: "{{ platform_prometheus_gid }}"
      mode: "0700"
    - path: "{{ platform_grafana_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_grafana_dir }}/provisioning/datasources"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_grafana_dir }}/provisioning/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_grafana_dir }}/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_grafana_state_dir }}"
      owner: "{{ platform_grafana_uid }}"
      group: "{{ platform_grafana_gid }}"
      mode: "0700"
    - path: "{{ platform_prometheus_rules_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_alertmanager_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_alertmanager_state_dir }}"
      owner: "{{ platform_alertmanager_uid }}"
      group: "{{ platform_alertmanager_gid }}"
      mode: "0700"
    - path: "{{ platform_loki_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ platform_loki_state_dir }}"
      owner: "{{ platform_loki_uid }}"
      group: "{{ platform_loki_gid }}"
      mode: "0700"
    - path: "{{ platform_alloy_dir }}"
      owner: root
      group: root
      mode: "0755"
    # Root: Alloy работает под root ради сокета Docker, и каталог позиций
    # должен принадлежать тому, кто в него пишет.
    - path: "{{ platform_alloy_state_dir }}"
      owner: root
      group: root
      mode: "0700"

# Each environment owns exactly one directory. Creating them here rather than
# in the control contour means Prometheus never references a path that does not
# exist, which it would otherwise report as a permanent file_sd read error.
- name: Create one target directory per environment
  ansible.builtin.file:
    path: "{{ platform_observability_targets_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ platform_observability_environments }}"

# An absent fragment is a permanent read error in the Prometheus logs, so every
# declared job starts as an explicit empty target list. `force: false` is what
# stops a platform deployment from erasing targets a control deployment wrote.
- name: Seed an empty fragment for every declared job
  ansible.builtin.copy:
    content: "[]\n"
    dest: >-
      {{ platform_observability_targets_dir }}/{{ item.0 }}/{{ item.1.name }}.json
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: "{{ platform_observability_environments | product(platform_observability_jobs) | list }}"
  loop_control:
    label: "{{ item.0 }}/{{ item.1.name }}"

# Rules ship with the contour so an alert can be reviewed in a diff. They are
# installed before the skeleton is validated: promtool reads the rule files the
# configuration points at, so a broken rule fails the deployment here rather
# than leaving the collector running with one group silently dropped.
- name: Deploy the alerting rules
  ansible.builtin.copy:
    src: rules/
    dest: "{{ platform_prometheus_rules_dir }}/"
    owner: root
    group: root
    mode: "0644"
  register: _platform_prometheus_rules

- name: Refuse to deploy alerting that would notify nobody
  ansible.builtin.assert:
    that:
      - platform_alertmanager_telegram_bot_token | length > 0
      - platform_alertmanager_telegram_chat_id | string | length > 0
    fail_msg: >-
      The platform bundle declares no Telegram receiver. Alerting without one
      looks deployed and wakes nobody; add
      platform_alertmanager_telegram_bot_token and
      platform_alertmanager_telegram_chat_id to the SOPS bundle and reconcile
      the management foundation from it.
  no_log: true

- name: Render the Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ platform_alertmanager_dir }}/alertmanager.yml"
    owner: "{{ platform_alertmanager_uid }}"
    group: "{{ platform_alertmanager_gid }}"
    mode: "0400"
  register: _platform_alertmanager_configuration
  no_log: true
  diff: false

- name: Render the shared collector skeleton
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ platform_observability_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  register: _platform_prometheus_configuration

# The control contour asserts its desired state against these values before it
# writes any fragment, so desired state cannot quietly disagree with what the
# shared collector actually does.
- name: Publish the shared collector contract for the control contour
  ansible.builtin.copy:
    content: |
      {
        "_notice": "GENERATED — DO NOT EDIT",
        "schema_version": 1,
        "scrape_interval_seconds": {{ platform_prometheus_scrape_interval_seconds | int }},
        "retention_days": {{ platform_prometheus_retention_days | int }},
        "log_retention_days": {{ platform_loki_retention_days | int }},
        "log_endpoint_port": {{ platform_loki_port | int }},
        "environments": {{ platform_observability_environments | to_json }},
        "jobs": {{ platform_observability_jobs | map(attribute='name') | list | to_json }},
        "targets_dir": "{{ platform_observability_targets_dir }}"
      }
    dest: "{{ platform_observability_dir }}/collector-contract.json"
    owner: root
    group: root
    mode: "0644"

# Generated once and then left alone: `creates` means a redeploy keeps the
# existing password rather than silently invalidating a session an operator is
# in the middle of. Read it on the hub when an administrator login is needed;
# viewing the dashboards needs no account at all.
- name: Generate the Grafana administrator password once
  ansible.builtin.shell:
    cmd: >-
      (umask 077 && openssl rand -base64 32
      > {{ platform_grafana_admin_password_file | quote }})
    creates: "{{ platform_grafana_admin_password_file }}"

- name: Restrict the Grafana administrator password to the container user
  ansible.builtin.file:
    path: "{{ platform_grafana_admin_password_file }}"
    owner: "{{ platform_grafana_uid }}"
    group: "{{ platform_grafana_gid }}"
    mode: "0400"

- name: Render the Grafana provisioning definitions
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: grafana-datasources.yml.j2
      dest: "{{ platform_grafana_dir }}/provisioning/datasources/datasources.yml"
    - src: grafana-dashboards.yml.j2
      dest: "{{ platform_grafana_dir }}/provisioning/dashboards/spiritvpn.yml"
  loop_control:
    label: "{{ item.dest }}"
  register: _platform_grafana_provisioning

# Файл переименован, когда к Prometheus добавился Loki. Прежний обязан
# исчезнуть, а не просто перестать обновляться: Grafana читает каталог целиком,
# и два файла с одним uid источника — это конфликт провижининга, который
# оставил бы дашборды без данных.
- name: Remove the superseded single-datasource provisioning file
  ansible.builtin.file:
    path: "{{ platform_grafana_dir }}/provisioning/datasources/prometheus.yml"
    state: absent
  register: _platform_grafana_superseded_datasource

- name: Deploy the dashboards Grafana is allowed to show
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ platform_grafana_dir }}/dashboards/"
    owner: root
    group: root
    mode: "0644"

- name: Render the log store and shipper configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: loki-config.yml.j2
      dest: "{{ platform_loki_dir }}/config.yml"
    - src: alloy-hub.alloy.j2
      dest: "{{ platform_alloy_dir }}/config.alloy"
  loop_control:
    label: "{{ item.dest }}"
  register: _platform_logs_configuration

- name: Render the shared collector compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ platform_observability_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  register: _platform_prometheus_compose

- name: Validate the skeleton with the pinned promtool
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --user
      - "{{ platform_prometheus_uid }}:{{ platform_prometheus_gid }}"
      - -v
      - "{{ platform_observability_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - -v
      - "{{ platform_observability_targets_dir }}:{{ platform_prometheus_targets_container_dir }}:ro"
      - -v
      - "{{ platform_prometheus_rules_dir }}:{{ platform_prometheus_rules_container_dir }}:ro"
      - --entrypoint
      - promtool
      - "{{ platform_prometheus_image }}"
      - check
      - config
      - /etc/prometheus/prometheus.yml
  changed_when: false
  when: not ansible_check_mode

- name: Reconcile the shared collector
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_observability_dir }}/compose.yml"
      - up
      - -d
      - --wait
      - --wait-timeout
      - "60"
      - --pull
      - missing
      - prometheus
      - node-exporter
      - grafana
      - alertmanager
      # Loki перечислен до alloy, но порядок здесь ничего не решает: его
      # задаёт depends_on. Готовность хранилища проверяется ниже отдельной
      # задачей — пробы у контейнера нет, см. комментарий в compose.yml.j2.
      - loki
      - alloy
  register: _platform_prometheus_apply
  changed_when: >-
    _platform_prometheus_compose.changed
    or 'Created' in (_platform_prometheus_apply.stdout ~ _platform_prometheus_apply.stderr)
    or 'Started' in (_platform_prometheus_apply.stdout ~ _platform_prometheus_apply.stderr)
    or 'Recreated' in (_platform_prometheus_apply.stdout ~ _platform_prometheus_apply.stderr)
    or 'Pulled' in (_platform_prometheus_apply.stdout ~ _platform_prometheus_apply.stderr)
  when: not ansible_check_mode

# The skeleton and the rules need this; fragment changes are picked up by
# file_sd on their own, which is the whole reason the environments write files
# instead of rewriting this configuration. Rules are not file_sd: with the
# lifecycle API deliberately disabled, a restart is the only way a changed rule
# reaches the running process.
- name: Restart the collector onto a changed skeleton or changed rules
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_observability_dir }}/compose.yml"
      - restart
      - prometheus
  when:
    - not ansible_check_mode
    - _platform_prometheus_configuration.changed or _platform_prometheus_rules.changed
    - not _platform_prometheus_apply.changed
  changed_when: true

- name: Restart Alertmanager onto a changed configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_observability_dir }}/compose.yml"
      - restart
      - alertmanager
  when:
    - not ansible_check_mode
    - _platform_alertmanager_configuration.changed
    - not _platform_prometheus_apply.changed
  changed_when: true

# Ни Loki, ни Alloy не перечитывают конфигурацию на ходу.
#
# Порядок обратный запуску, и это не симметрия ради симметрии: перезапуск Loki
# рвёт запись, поэтому шипер поднимается после хранилища и перезапускается
# последним. Позиции чтения Alloy переживают перезапуск в каталоге состояния,
# так что несколько секунд простоя не теряют строк.
- name: Restart the log store onto a changed configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_observability_dir }}/compose.yml"
      - restart
      - loki
      - alloy
  when:
    - not ansible_check_mode
    - _platform_logs_configuration.changed
    - not _platform_prometheus_apply.changed
  changed_when: true

# Dashboards are re-read by the file provider on its own interval; datasources
# are read once at startup.
#
# Отсюда правило: решение о перезапуске принимается по тому, что Grafana
# загрузила, а не по тому, что роль записала в этом прогоне. Стоило это красной
# выкатки с зелёным продолжением: прогон упал между записью datasources.yml и
# этой задачей, файл на хабе появился, Grafana его не прочитала — а в следующий
# раз `template` отчитался «без изменений», условие дало false, и источник Loki
# не появился бы уже никогда. Флаг «я поменял файл» описывает прошлое роли,
# а не настоящее сервиса, и после любого обрыва они расходятся навсегда.
- name: Ask Grafana which datasources it actually loaded
  ansible.builtin.uri:
    url: >-
      http://{{ platform_grafana_bind_address }}:{{
      platform_grafana_port }}/api/frontend/settings
    method: GET
    timeout: 5
  register: _platform_grafana_loaded
  # Недоступная Grafana — это ноль загруженных источников, то есть повод
  # перезапустить, а не повод падать здесь.
  failed_when: false
  changed_when: false
  when: not ansible_check_mode

- name: Note which declared datasources Grafana is missing
  ansible.builtin.set_fact:
    _platform_grafana_missing_datasources: >-
      {{ platform_grafana_datasource_uids | difference(
           _platform_grafana_loaded.json.datasources | default({})
           | dict2items | map(attribute='value')
           | selectattr('uid', 'defined') | map(attribute='uid')
           | select('string') | list) }}
  when: not ansible_check_mode

- name: Restart Grafana onto provisioning it has not loaded
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_observability_dir }}/compose.yml"
      - restart
      - grafana
  when:
    - not ansible_check_mode
    # Первое условие закрывает и обрыв, и штатное добавление источника. Только
    # им обойтись нельзя: смена адреса или типа источника оставляет uid на
    # месте, и по одному наблюдаемому состоянию такая правка не видна.
    #
    # Удаление прежнего файла — тоже изменение провижининга: без перезапуска
    # Grafana продолжила бы держать источник, прочитанный из уже несуществующего
    # файла, до следующего своего рестарта.
    #
    # Оговорки «только если compose ничего не пересоздавал» здесь больше нет:
    # тот флаг поднимается, когда пересоздан любой сервис, и о Grafana не
    # говорит ничего. Пересозданный Loki отменял перезапуск Grafana. Лишний
    # перезапуск только что поднятой Grafana безвреден, пропущенный — нет.
    - >-
      _platform_grafana_missing_datasources | length > 0
      or _platform_grafana_provisioning.changed
      or _platform_grafana_superseded_datasource.changed
  changed_when: true

- name: Require collector readiness on loopback
  ansible.builtin.uri:
    url: >-
      http://{{ platform_prometheus_bind_address }}:{{
      platform_prometheus_port }}/-/ready
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: _platform_prometheus_readiness
  retries: 12
  delay: 5
  until: _platform_prometheus_readiness.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Require the hub exporter to answer on loopback
  ansible.builtin.uri:
    url: >-
      http://{{ platform_node_exporter_bind_address }}:{{
      platform_node_exporter_port }}/metrics
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  changed_when: false
  when: not ansible_check_mode

# По петле, хотя принимает Loki на всех адресах: проверяется, что процесс
# готов, а не что до него дотянулся оверлей. Достижимость с ноды — вопрос
# фаервола, и её ловит уже сама выкатка ноды.
- name: Require the log store to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ platform_loki_port }}/ready"
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: _platform_loki_readiness
  retries: 12
  delay: 5
  until: _platform_loki_readiness.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Require Alertmanager readiness on loopback
  ansible.builtin.uri:
    url: >-
      http://{{ platform_alertmanager_bind_address }}:{{
      platform_alertmanager_port }}/-/ready
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: _platform_alertmanager_readiness
  retries: 12
  delay: 5
  until: _platform_alertmanager_readiness.status == 200
  changed_when: false
  when: not ansible_check_mode

- name: Require Grafana readiness on loopback
  ansible.builtin.uri:
    url: >-
      http://{{ platform_grafana_bind_address }}:{{
      platform_grafana_port }}/api/health
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: _platform_grafana_readiness
  retries: 12
  delay: 5
  until: _platform_grafana_readiness.status == 200
  changed_when: false
  when: not ansible_check_mode
