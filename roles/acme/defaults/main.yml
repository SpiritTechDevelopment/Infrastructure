---
# Certificate issuance via certbot + Cloudflare DNS-01.
# Runs on the platform host (control-1); the issued cert is fetched back to the
# controller so the fleet nodes can read it into mask_tls_certificate.

acme_enabled: true

# Email for Let's Encrypt expiry notices — change to yours.
acme_email: "admin@vmshare.ru"

# One SAN cert covering the apex (entry) + every subdomain (exit nl/fr/ru/pl).
acme_cert_name: "vmshare.ru"
acme_domains:
  - "vmshare.ru"
  - "*.vmshare.ru"

# DNS propagation wait before Let's Encrypt validates (Cloudflare is fast, 30s is safe).
acme_propagation_seconds: 30

acme_cloudflare_ini: "/etc/letsencrypt/cloudflare.ini"
acme_live_dir: "/etc/letsencrypt/live/{{ acme_cert_name }}"

# Where the fetched cert lands on the controller (repo root / .local-secrets).
acme_fetch_dir: "{{ playbook_dir }}/../.local-secrets"

# cloudflare_api_token is intentionally not defaulted. Pass it from a protected
# local extra-vars file. The role fails clearly if it is missing.
