---
- name: Ensure VPN stack directory
  ansible.builtin.file:
    path: "{{ vpn_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render VPN Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vpn_stack_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: _vpn_compose_render

- name: Determine whether the VPN services need recreation
  ansible.builtin.set_fact:
    _vpn_stack_recreate: >-
      {{
        (_vpn_compose_render.changed | default(false))
        or (_xray_config_render.changed | default(false))
        or (_nginx_mask_certificate.changed | default(false))
        or (_nginx_mask_private_key.changed | default(false))
        or (_nginx_mask_config.changed | default(false))
        or (_nginx_mask_page.changed | default(false))
        or (_alloy_config_render.changed | default(false))
      }}

# Apply only after Xray, nginx, certificates and Alloy configuration all exist.
# This avoids the old first-deploy handler race against a missing compose.yml.
- name: Apply complete VPN stack
  ansible.builtin.command:
    argv: >-
      {{
        ['docker', 'compose', '-f', vpn_stack_dir ~ '/compose.yml',
         'up', '-d', '--remove-orphans', '--wait', '--wait-timeout', '120',
         '--pull', vpn_stack_pull]
        + (['--force-recreate'] if _vpn_stack_recreate | bool else [])
      }}
  register: _vpn_stack_apply
  changed_when: >-
    _vpn_stack_recreate | bool
    or ('Created' in _vpn_stack_apply.stderr)
    or ('Started' in _vpn_stack_apply.stderr)
    or ('Recreated' in _vpn_stack_apply.stderr)
    or ('Pulled' in _vpn_stack_apply.stderr)

# Node-local auto-reconcile (self-heal runtime users after an Xray restart).
# Add-only; no-op without a backend snapshot. See BACKEND_INTEGRATION.md.
- name: Auto-reconcile — create script lib dir
  ansible.builtin.file:
    path: "{{ xray_reconcile_libdir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Auto-reconcile — install helper scripts
  ansible.builtin.copy:
    src: "{{ role_path }}/../../scripts/{{ item }}"
    dest: "{{ xray_reconcile_libdir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - xray-api.sh
    - xray-reconcile.sh
    - xray-users.py
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Auto-reconcile — install wrapper
  ansible.builtin.template:
    src: auto-reconcile.sh.j2
    dest: "{{ xray_reconcile_libdir }}/auto-reconcile.sh"
    owner: root
    group: root
    mode: "0755"
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Auto-reconcile — ensure snapshot directory exists
  ansible.builtin.file:
    path: "{{ xray_reconcile_snapshot | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Auto-reconcile — install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - spirit-xray-reconcile.service
    - spirit-xray-reconcile.timer
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Auto-reconcile — enable + start the timer
  ansible.builtin.systemd_service:
    name: spirit-xray-reconcile.timer
    enabled: true
    state: started
    daemon_reload: true
  when: xray_auto_reconcile_enabled | bool
  tags: [reconcile]

- name: Desired-user sync — validate backend contract
  ansible.builtin.assert:
    that:
      - xray_auto_reconcile_enabled | bool
      - xray_desired_users_url is match('^https?://')
      - xray_desired_users_token | length >= 32
      - xray_desired_users_sync_interval | int >= 10
    fail_msg: >-
      Desired-user synchronization requires auto-reconcile, a backend URL,
      a service token and an interval of at least 10 seconds.
  when: xray_desired_users_sync_enabled | bool
  no_log: true
  tags: [reconcile]

- name: Desired-user sync — create secret directory
  ansible.builtin.file:
    path: "{{ xray_desired_users_token_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: xray_desired_users_sync_enabled | bool
  tags: [reconcile]

- name: Desired-user sync — install backend token
  ansible.builtin.copy:
    content: "{{ xray_desired_users_token }}\n"
    dest: "{{ xray_desired_users_token_file }}"
    owner: root
    group: root
    mode: "0600"
  when: xray_desired_users_sync_enabled | bool
  no_log: true
  diff: false
  tags: [reconcile]

- name: Desired-user sync — install fetch helper
  ansible.builtin.template:
    src: fetch-desired-users.sh.j2
    dest: "{{ xray_reconcile_libdir }}/fetch-desired-users.sh"
    owner: root
    group: root
    mode: "0755"
  when: xray_desired_users_sync_enabled | bool
  tags: [reconcile]

- name: Desired-user sync — install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - spirit-desired-users-sync.service
    - spirit-desired-users-sync.timer
  when: xray_desired_users_sync_enabled | bool
  tags: [reconcile]

- name: Desired-user sync — enable + start timer
  ansible.builtin.systemd_service:
    name: spirit-desired-users-sync.timer
    enabled: true
    state: started
    daemon_reload: true
  when: xray_desired_users_sync_enabled | bool
  tags: [reconcile]
