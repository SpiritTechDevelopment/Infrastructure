---
vpn_stack_dir: /opt/vpn
compose_project: vpn
vpn_stack_pull: missing

# Complete image defaults make the example inventory independently deployable.
xray_image: ghcr.io/xtls/xray-core:26.3.27
nginx_mask_image: nginx:1.29-alpine
alloy_image: grafana/alloy:v1.17.1
node_exporter_image: quay.io/prometheus/node-exporter:v1.9.1

# Local-only support listeners used by the host-networked containers.
mask_bind_address: 127.0.0.1
mask_port: 8443
node_exporter_bind_address: 127.0.0.1
node_exporter_port: 9100

# Node-local auto-reconcile: a systemd timer re-adds the backend's desired runtime
# users after an Xray restart (add-only — never prunes — so a stale snapshot cannot
# remove a live user). Off by default; enabled for the entry group. The snapshot is
# written by the backend (see BACKEND_INTEGRATION.md); if absent, the timer no-ops.
xray_auto_reconcile_enabled: false
xray_reconcile_libdir: /usr/local/lib/spirit-xray
xray_reconcile_snapshot: /var/lib/xray/desired-users.json
xray_reconcile_interval: 30
xray_inbound_tag: vless-in

# Optional pull-based desired-state synchronization. The entry fetches the
# authoritative snapshot from the backend over the WireGuard overlay and writes
# it atomically for the existing add-only reconcile timer.
xray_desired_users_sync_enabled: false
xray_desired_users_url: ""
xray_desired_users_token: ""
xray_desired_users_token_file: /etc/spiritvpn/backend-snapshot.token
xray_desired_users_sync_interval: 20
