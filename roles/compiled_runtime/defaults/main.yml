---
vpn_stack_dir: /opt/vpn
compose_project: spiritvpn-node
compiled_runtime_pull_policy: missing
# Потолок на логи одного контейнера: max-size × max-file. Через xray идёт
# трафик, и на этих хостах он самый разговорчивый — предел общий, чтобы
# «сколько занимают логи» был один расчёт, а не четыре.
compiled_runtime_log_max_size: 10m
compiled_runtime_log_max_files: "5"
node_agent_runtime_inputs_changed: false

# Ноды, собранные вручную до перехода на скомпилированный контур, держат свои
# контейнеры в отдельном compose-проекте. Он занимает те же порты, и
# --remove-orphans его не видит: чужой проект для compose не сирота. Уступает
# место здесь, а не раньше, чтобы простой длился с подъёма стека, а не со
# старта плейбука.
compiled_runtime_superseded_projects:
  - vpn

# Самолечение прежней сборки: таймеры дописывали пользователей в старый Xray и
# тянули их с исчезнувшего бэкенда. Дотянуться до скомпилированного узла они не
# могут — ищут инбаунд vless-in, которого в компилируемом конфиге нет, там
# xi-vless, — но продолжают срабатывать по таймеру и копить отказы в журнале и
# в systemctl --failed, пряча в шуме настоящие сбои.
#
# Останавливаются, а таймеры ещё и выключаются. Замаскировать нельзя: файлы
# юнитов лежат в /etc/systemd/system, куда systemctl mask и ставит свой симлинк
# на /dev/null, так что маскировка требовала бы сначала удалить чужие файлы.
# Остаётся один остаточный риск — запуск руками; он приемлем, потому что до
# нового Xray эти скрипты всё равно не дотягиваются.
compiled_runtime_superseded_units:
  - spirit-desired-users-sync.timer
  - spirit-desired-users-sync.service
  - spirit-xray-reconcile.timer
  - spirit-xray-reconcile.service
