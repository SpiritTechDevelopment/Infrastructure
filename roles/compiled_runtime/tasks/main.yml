---
- name: Ensure compiled runtime and local log directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ vpn_stack_dir }}", mode: "0755"}
    - {path: /var/log/xray, mode: "0750"}
    - {path: "{{ vpn_stack_dir }}/alloy", mode: "0755"}
    - {path: "{{ alloy_state_dir }}", mode: "0700"}

# До compose: он ссылается на этот файл, а `docker compose` разбирает проект
# целиком при любом вызове. Отсутствующий bind-mount источника ломал бы команды,
# направленные на совсем другие сервисы.
- name: Render the log shipper configuration
  ansible.builtin.template:
    src: alloy-node.alloy.j2
    dest: "{{ vpn_stack_dir }}/alloy/config.alloy"
    owner: root
    group: root
    mode: "0644"
  register: _compiled_runtime_alloy_configuration

- name: Render compiled node runtime definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ vpn_stack_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: _compiled_runtime_definition

- name: Read installed unit files
  ansible.builtin.command:
    argv: [systemctl, list-unit-files, --no-legend, --plain]
  register: _compiled_runtime_unit_files
  changed_when: false
  check_mode: false

# Гасим триггер, а не пытаемся замаскировать: файлы этих юнитов лежат в
# /etc/systemd/system, то есть ровно там, куда systemctl mask ставит симлинк на
# /dev/null. Замаскировать их нельзя, не удалив файлы, которых эта выкатка не
# создавала. Работу же им даёт таймер, и выключенный таймер её не даст: сервисы
# static, сами по себе они не запускаются.
#
# Только по действительно установленным юнитам — на узле, где их не было,
# трогать нечего.
- name: Retire superseded self-heal units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    # Снимаем с автозапуска только то, что на нём стоит. Решать по суффиксу
    # имени значило бы звать disable для static-юнита и снова падать на том,
    # что systemd отказывается делать бессмысленное.
    enabled: >-
      {{ false
         if _compiled_runtime_unit_files.stdout is search(
              '^' ~ (item | regex_escape) ~ '\s+enabled', multiline=True)
         else omit }}
  loop: "{{ compiled_runtime_superseded_units }}"
  when:
    - not ansible_check_mode
    - _compiled_runtime_unit_files.stdout is search('^' ~ (item | regex_escape) ~ '\s', multiline=True)

- name: Find containers of superseded stacks
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
      - --filter
      - "label=com.docker.compose.project={{ item }}"
  loop: "{{ compiled_runtime_superseded_projects }}"
  register: _compiled_runtime_superseded
  changed_when: false
  check_mode: false

# Останавливаем, а не удаляем: откат сводится к docker start, пока контейнеры
# целы. Политика unless-stopped после явной остановки их не поднимет.
- name: Stop superseded stacks holding the compiled runtime's ports
  ansible.builtin.command:
    argv: "{{ ['docker', 'stop'] + _compiled_runtime_superseded_ids }}"
  vars:
    _compiled_runtime_superseded_ids: >-
      {{ _compiled_runtime_superseded.results | map(attribute='stdout_lines') | flatten }}
  register: _compiled_runtime_stop
  changed_when: true
  when:
    - not ansible_check_mode
    - _compiled_runtime_superseded_ids | length > 0

# Пока порт был занят, Docker разводил попытки перезапуска по экспоненте и
# дошёл до потолка в минуту. Компоуз столько не ждёт и ждать не умеет:
# контейнер в состоянии Restarting он сразу считает нездоровым и возвращает
# ошибку. Без явного сброса выкатка падает на последствии того, что сама же
# только что починила, — ровно это и произошло на entry-ru: xray поднялся
# здоровым через 45 секунд после того, как Ansible объявил его сбойным.
- name: Clear the restart backoff the conflict left behind
  ansible.builtin.command:
    argv: [docker, compose, -f, "{{ vpn_stack_dir }}/compose.yml", restart]
  changed_when: true
  when:
    - not ansible_check_mode
    - _compiled_runtime_stop is changed

- name: Apply compiled node runtime
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ vpn_stack_dir }}/compose.yml"
      - up
      - -d
      - --remove-orphans
      - --wait
      - --wait-timeout
      - "120"
      - --pull
      - "{{ compiled_runtime_pull_policy }}"
  register: _compiled_runtime_apply
  changed_when: >-
    _compiled_runtime_definition.changed
    or _compiled_runtime_alloy_configuration.changed
    or node_agent_runtime_inputs_changed | bool
    or 'Created' in _compiled_runtime_apply.stderr
    or 'Started' in _compiled_runtime_apply.stderr
    or 'Recreated' in _compiled_runtime_apply.stderr
    or 'Pulled' in _compiled_runtime_apply.stderr
  when: not ansible_check_mode

# Xray reads config.json only at process start. The file is also a durable
# target for NodeAgent, which atomically replaces it, so a bind-mounted update
# alone never changes the running process. Reload the reviewed startup config
# before readiness; otherwise the on-disk API route and the live route can
# silently disagree while the syntax-only check stays green.
- name: Restart Xray onto a changed startup configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ vpn_stack_dir }}/compose.yml"
      - restart
      - xray
  when:
    - not ansible_check_mode
    - _xray_config_render.changed
  changed_when: true

- name: Wait for the restarted Xray API
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ vpn_stack_dir }}/compose.yml"
      - up
      - -d
      - --wait
      - --wait-timeout
      - "120"
      - xray
  when:
    - not ansible_check_mode
    - _xray_config_render.changed
  changed_when: false

# Конфигурация приезжает bind-mount'ом, поэтому её правка не пересоздаёт
# контейнер, а Alloy не перечитывает файл на ходу. Без этого изменённый конфиг
# лежал бы на диске, а работал бы прежний — до следующего пересоздания по
# другой причине.
- name: Restart the log shipper onto a changed configuration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ vpn_stack_dir }}/compose.yml"
      - restart
      - alloy
  when:
    - not ansible_check_mode
    - _compiled_runtime_alloy_configuration.changed
    - not _compiled_runtime_apply.changed
  changed_when: true
