---
- name: Validate Telegram bot deployment contract
  ansible.builtin.assert:
    that:
      - telegram_bot_image is match('^ghcr\.io/spirittechdevelopment/spiritvpn-telegram-bot:sha-[0-9a-f]{40}$')
      - telegram_bot_token is match('^[0-9]{8,12}:[A-Za-z0-9_-]{35,}$')
      - telegram_bot_backend_base_url is match('^https?://')
      - telegram_bot_backend_token | length >= 32
      - telegram_bot_health_address | length > 0
      - telegram_bot_health_port | int > 0
      - telegram_bot_health_port | int < 65536
      - telegram_bot_poll_timeout | int >= 1
      - telegram_bot_poll_timeout | int <= 60
      - (telegram_bot_ghcr_token | length == 0) or (telegram_bot_ghcr_username | length > 0)
    fail_msg: >-
      Telegram bot deployment requires an immutable SHA image, valid BotFather
      token and backend service token supplied through encrypted or untracked vars.
  no_log: true

- name: Create Telegram bot stack directory
  ansible.builtin.file:
    path: "{{ telegram_bot_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render Telegram bot environment
  ansible.builtin.template:
    src: bot.env.j2
    dest: "{{ telegram_bot_stack_dir }}/bot.env"
    owner: root
    group: root
    mode: "0600"
  register: _telegram_bot_env
  no_log: true
  diff: false

- name: Render Telegram bot Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ telegram_bot_stack_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: _telegram_bot_compose

- name: Authenticate Docker to private GHCR for Telegram bot
  ansible.builtin.command:
    argv:
      - docker
      - login
      - ghcr.io
      - --username
      - "{{ telegram_bot_ghcr_username }}"
      - --password-stdin
    stdin: "{{ telegram_bot_ghcr_token }}"
  changed_when: false
  no_log: true
  when: telegram_bot_ghcr_token | length > 0

- name: Apply Telegram bot staging stack
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ telegram_bot_compose_project }}"
      - --file
      - "{{ telegram_bot_stack_dir }}/compose.yml"
      - up
      - --detach
      - --remove-orphans
      - --wait
      - --wait-timeout
      - "60"
      - --pull
      - always
  register: _telegram_bot_apply
  changed_when: >-
    (_telegram_bot_env.changed | default(false))
    or (_telegram_bot_compose.changed | default(false))
    or ('Created' in (_telegram_bot_apply.stdout ~ _telegram_bot_apply.stderr))
    or ('Started' in (_telegram_bot_apply.stdout ~ _telegram_bot_apply.stderr))
    or ('Recreated' in (_telegram_bot_apply.stdout ~ _telegram_bot_apply.stderr))
    or ('Pulled' in (_telegram_bot_apply.stdout ~ _telegram_bot_apply.stderr))

- name: Verify Telegram bot liveness
  ansible.builtin.uri:
    url: "http://{{ telegram_bot_health_address }}:{{ telegram_bot_health_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: _telegram_bot_health
  retries: 12
  delay: 5
  until:
    - _telegram_bot_health.status == 200
    - (_telegram_bot_health.json.status | default('')) == 'ok'
    - (_telegram_bot_health.json.service | default('')) == 'spiritvpn-telegram-bot'
