---
common_timezone: UTC

# Deployment mode gate:
#   runtime   — application only; the role REFUSES any hardening flag (tripwire).
#   bootstrap — first-time node onboarding: application + hardening + deploy user.
#   hardened  — steady-state re-assertion of hardening on an already-hardened node.
# Hardening tasks run only when deploy_mode is bootstrap/hardened AND their flag
# is true. In runtime mode every hardening flag must stay false.
deploy_mode: runtime

# Hardening flags. In runtime mode these are tripwires (must be false); in
# bootstrap/hardened mode they enable the corresponding hardening task.
common_manage_deploy_user: false
common_manage_sshd: false
common_manage_firewall: false
common_enable_fail2ban: false
common_manage_sysctl: false
common_enable_unattended_upgrades: false
common_enable_auditd: false

# --- sshd port (rendered only when common_manage_sshd) ---
# The port the role makes sshd listen on. Empty means the role does not own the
# port at all: no Port directive is emitted and sshd keeps whatever it already
# listens on. That is the default on purpose — the platform hub runs this role
# without declaring a port, and silently moving its sshd would be the most
# expensive possible mistake. Compiled traffic nodes set it from desired state.
common_ssh_port: ""
# Bootstrap escape hatches that this role created or explicitly adopted. They
# are removed once the managed drop-in is ready; arbitrary sshd fragments are
# never pruned from a host without first being named here.
common_retired_sshd_dropins:
  - 99-temp-bootstrap.conf

# --- Firewall (nftables) — rendered only when common_manage_firewall is true.
# Safe defaults: empty lists render a minimal ruleset, and an empty
# ssh_allowed_cidrs falls back to SSH-from-anywhere during first bootstrap so
# enabling the firewall cannot lock out the active connection. Compiled
# steady-state plans must override it with the management network.
# The firewall and fail2ban must follow the port the role is moving sshd to, not
# the port the current connection came in on — during first bootstrap those
# differ (connection on 22, sshd headed for common_ssh_port).
ssh_port: >-
  {{ common_ssh_port if (common_ssh_port | string | length > 0)
  else (ansible_port | default(22)) }}
# Порты, которые слушает sshd и пропускает firewall.
#
# В фазе бутстрапа их два. Роль меняет sshd и nftables в середине своей работы,
# а Ansible держит соединение через ControlPersist и переоткрывает его когда
# сочтёт нужным — то есть узел обязан оставаться достижимым по тому порту, по
# которому бутстрап пришёл, до самого конца прогона. Иначе роль рубит сук, на
# котором сидит: так и вышло на exit-ro, оборвавшемся посреди `common`.
#
# Установившаяся фаза оставляет только объявленный порт: к ней узел уже
# слушает оба, и путь под ней ничего не меняет.
common_ssh_ports: >-
  {{ ([22, ssh_port | int] | unique | list) if deploy_mode == 'bootstrap'
  else [ssh_port | int] }}
ssh_allowed_cidrs: []                      # [] = allow SSH from anywhere (fallback)
common_public_tcp_ports: []                # ports open to the internet (input chain)
common_public_udp_ports: []
# Networks allowed to ping this host, and the only networks this host may ping.
# Empty means the host answers no echo at all and emits none — the correct
# default for anything facing the internet, because an answered ping confirms
# the host exists and, when every node answers identically, enumerates the
# fleet. Hosts that need diagnostics name their management network here.
# Trusted interfaces are accepted wholesale before this and do not need an entry.
common_icmp_echo_cidrs: []
# Fully trusted pre-existing tunnel interfaces. Platform bootstrap discovers
# active WireGuard interfaces and uses this only to preserve operator access.
common_trusted_interfaces: []
# Bridges whose containers may open outbound connections. Empty by default:
# a host whose containers all run with `network_mode: host` never needs it, and
# that is every node in the fleet.
common_container_egress_interfaces: []
# Source-scoped rules. `forward_ports` optionally describes the post-DNAT
# container port when it differs from the host-facing `ports`.
common_restricted_tcp_rules: []            # [{ports, forward_ports?, cidrs, interface}]
common_restricted_interface: ""

# --- fail2ban (rendered only when common_enable_fail2ban) ---
# SSH brute-force protection via the systemd journal backend. `port` derives from
# ssh_port so the ban action targets the real SSH port.
common_fail2ban_maxretry: 5
common_fail2ban_findtime: 600
common_fail2ban_bantime: 3600
# Environment playbooks extend this with reviewed management and operator CIDRs.
common_fail2ban_ignoreip: "127.0.0.1/8 ::1"

# --- unattended-upgrades (common_enable_unattended_upgrades) ---
# Auto-apply security updates only; never auto-reboot (a reboot would drop the
# data plane + in-memory runtime users).
common_unattended_auto_reboot: false

# --- deploy user (common_manage_deploy_user) ---
# Named, auditable non-root account for steady-state deploys. docker group + sudo
# make it root-equivalent on a Docker host — accepted deliberately; the win is a
# named account with no root-password login, not a hard boundary. Its
# authorized_keys is the reviewed operator roster. Root stays as key-only
# break-glass; migration of the coordinator to the deploy user is separate.
common_deploy_user: deploy
common_deploy_groups: [sudo, docker]
common_authorized_keys: []
