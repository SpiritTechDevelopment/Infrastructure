---
common_timezone: UTC

# Deployment mode gate:
#   runtime   — application only; the role REFUSES any hardening flag (tripwire).
#   bootstrap — first-time node onboarding: application + hardening + deploy user.
#   hardened  — steady-state re-assertion of hardening on an already-hardened node.
# Hardening tasks run only when deploy_mode is bootstrap/hardened AND their flag
# is true. In runtime mode every hardening flag must stay false.
deploy_mode: runtime

# Hardening flags. In runtime mode these are tripwires (must be false); in
# bootstrap/hardened mode they enable the corresponding hardening task.
common_manage_deploy_user: false
common_remove_legacy_sshd_dropin: false
common_manage_sshd: false
common_manage_firewall: false
common_enable_fail2ban: false
common_manage_sysctl: false
common_enable_unattended_upgrades: false
common_enable_auditd: false

# --- Firewall (nftables) — rendered only when common_manage_firewall is true.
# Safe defaults: empty lists render a minimal ruleset, and an empty
# ssh_allowed_cidrs falls back to SSH-from-anywhere so enabling the firewall
# without setting admin sources cannot lock you out. Set per host/group.
common_firewall_engine: nftables          # nftables | ufw (exit-fr uses ufw)
ssh_port: "{{ ansible_port | default(22) }}"
ssh_allowed_cidrs: []                      # [] = allow SSH from anywhere (fallback)
common_public_tcp_ports: []                # ports open to the internet (input chain)
common_public_udp_ports: []
common_restricted_tcp_rules: []            # [{ports, cidrs, interface}] source-scoped
common_restricted_tcp_ports: []            # legacy flat form (used if _rules empty)
common_restricted_cidrs: []
common_restricted_interface: ""
common_management_forwarding_enabled: false  # hub-only: forward between overlay spokes
common_management_interface: wg0
common_management_cidr: 10.20.0.0/24
# Docker bridge egress in the forward chain (the rule the orphaned template lacked).
common_docker_bridge_forwarding: false
common_docker_bridge_cidr: 172.16.0.0/12
