---
# Runtime prerequisites plus deploy_mode-gated host hardening. In runtime mode
# this role makes no access-control or security-policy changes (the tripwire
# below enforces that). Hardening runs only in bootstrap/hardened mode.
- name: Validate deploy_mode
  ansible.builtin.assert:
    that:
      - deploy_mode in ['runtime', 'bootstrap', 'hardened']
    fail_msg: "deploy_mode must be one of: runtime, bootstrap, hardened."

- name: Refuse access and host-hardening changes in runtime mode
  ansible.builtin.assert:
    that:
      - not common_manage_deploy_user | bool
      - not common_manage_sshd | bool
      - not common_manage_firewall | bool
      - not common_enable_fail2ban | bool
      - not common_manage_sysctl | bool
      - not common_enable_auditd | bool
      - not common_enable_unattended_upgrades | bool
    fail_msg: >-
      Runtime deployment is intentionally forbidden from changing users, SSH,
      sudoers, firewall, fail2ban, sysctl, auditd, or unattended upgrades.
      Keep every common_* access/hardening flag false, or run with
      deploy_mode=bootstrap|hardened to enable hardening.
  when: deploy_mode == 'runtime'

- name: Install base runtime packages
  ansible.builtin.apt:
    name:
      - chrony
      - python3
      - curl
      - ca-certificates
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Enable chrony
  ansible.builtin.service:
    name: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"
    state: started
    enabled: true

- name: Read current timezone
  ansible.builtin.command:
    argv: [timedatectl, show, --property=Timezone, --value]
  register: _current_timezone
  changed_when: false

- name: Set timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, "{{ common_timezone }}"]
  when: _current_timezone.stdout | trim != common_timezone
  changed_when: true

# --- Host hardening (bootstrap/hardened mode only; each gated by its flag) ---

# Named, auditable non-root deploy account (docker + sudo, key-only). Additive —
# root stays as break-glass; ansible_user is migrated to deploy separately once
# this is proven. authorized_keys contains the reviewed operator roster.
- name: Require an operator key before creating the deployment account
  ansible.builtin.assert:
    that:
      - common_authorized_keys | length > 0
    fail_msg: "At least one reviewed operator SSH public key is required for the deployment user."
  when: common_manage_deploy_user | bool

- name: Create deploy user
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    shell: /bin/bash
    groups: "{{ common_deploy_groups }}"
    append: true
    create_home: true
  when: common_manage_deploy_user | bool

- name: Grant deploy passwordless sudo
  ansible.builtin.copy:
    content: "{{ common_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/90-deploy
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: common_manage_deploy_user | bool

- name: Ensure deploy .ssh directory
  ansible.builtin.file:
    path: "/home/{{ common_deploy_user }}/.ssh"
    state: directory
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0700"
  when: common_manage_deploy_user | bool

- name: Install deploy authorized_keys (operator roster)
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: "/home/{{ common_deploy_user }}/.ssh/authorized_keys"
    owner: "{{ common_deploy_user }}"
    group: "{{ common_deploy_user }}"
    mode: "0600"
  when: common_manage_deploy_user | bool

# Key-only root, no password/keyboard-interactive auth. A drop-in overrides any
# distro/cloud-init default via first-match ordering (00- sorts before 50-).
# validate: on the fragment catches syntax errors before placement; the handler
# re-validates the assembled config with `sshd -t` before reloading.
- name: Harden sshd (key-only root, disable password auth)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-spirit-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  when: common_manage_sshd | bool
  notify: Reload sshd

- name: Validate explicitly retired sshd drop-in names
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.-]+\.conf$')
      - item not in ['00-spirit-hardening.conf']
    fail_msg: "Retired sshd drop-ins must be safe basenames and may not name the managed file."
  loop: "{{ common_retired_sshd_dropins }}"
  when: common_manage_sshd | bool

- name: Remove explicitly retired sshd drop-ins
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/{{ item }}"
    state: absent
  loop: "{{ common_retired_sshd_dropins }}"
  when: common_manage_sshd | bool
  notify: Reload sshd

# nftables firewall. Uses add+delete (not `flush ruleset`) so Docker's ip nat
# table survives — no `docker restart` needed after a reload. `validate` parses
# the candidate with `nft -c` before it is placed.
- name: Install nftables firewall tooling
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
  when:
    - common_manage_firewall | bool

- name: Validate trusted tunnel interface names
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9_.-]{1,15}$')
    fail_msg: "Trusted firewall interfaces must be valid Linux interface names."
  loop: "{{ common_trusted_interfaces }}"
  when: common_manage_firewall | bool

- name: Render nftables firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  when:
    - common_manage_firewall | bool

- name: Start and enable nftables service
  ansible.builtin.service:
    name: nftables
    state: started
    enabled: true
  when:
    - common_manage_firewall | bool

# A handler alone is insufficient reconciliation: if /etc/nftables.conf is
# already correct but the kernel table was changed by hand, the template task
# is unchanged and no handler runs. Re-applying this role-owned table is one
# nftables transaction and leaves Docker-owned tables intact.
- name: Reconcile the live nftables ruleset on every hardened run
  ansible.builtin.command: nft -f /etc/nftables.conf
  changed_when: false
  when:
    - common_manage_firewall | bool

# fail2ban — SSH brute-force protection (systemd journal backend, port-aware ban).
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
  when: common_enable_fail2ban | bool

- name: Configure fail2ban sshd jail
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  when: common_enable_fail2ban | bool
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: common_enable_fail2ban | bool

# sysctl — conservative kernel hardening. PRESERVES ip_forward=1 (Docker + WG hub
# need it) and omits rp_filter (would break overlay/asymmetric routing).
- name: Deploy sysctl hardening
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/90-spirit-hardening.conf
    owner: root
    group: root
    mode: "0644"
  when: common_manage_sysctl | bool
  notify: Reload sysctl

# auditd — file/identity/privilege watch rules (uses the existing audit.rules.j2).
- name: Install auditd
  ansible.builtin.apt:
    name: auditd
    state: present
    update_cache: true
  when: common_enable_auditd | bool

- name: Deploy audit rules
  ansible.builtin.template:
    src: audit.rules.j2
    dest: /etc/audit/rules.d/90-spirit.rules
    owner: root
    group: root
    mode: "0640"
  when: common_enable_auditd | bool
  notify: Load audit rules

- name: Enable auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: common_enable_auditd | bool

# Guarantee rules are loaded on every hardened run — the Load-audit-rules handler
# only fires on a file change, so an interrupted prior run could leave rules
# written-but-not-loaded. augenrules --load is idempotent ("No change" when
# already current).
- name: Ensure audit rules are loaded
  ansible.builtin.command: augenrules --load
  changed_when: false
  when: common_enable_auditd | bool

# unattended-upgrades — auto security updates, never auto-reboot.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
    update_cache: true
  when: common_enable_unattended_upgrades | bool

- name: Enable periodic unattended-upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: common_enable_unattended_upgrades | bool

- name: Constrain unattended-upgrades (no auto-reboot)
  ansible.builtin.template:
    src: 52-spirit-unattended.conf.j2
    dest: /etc/apt/apt.conf.d/52-spirit-unattended
    owner: root
    group: root
    mode: "0644"
  when: common_enable_unattended_upgrades | bool
