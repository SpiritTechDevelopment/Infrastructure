---
# Validate the full assembled sshd config, then reload (never restart — keeps
# existing sessions alive). Fires only from hardening tasks in bootstrap/hardened.
- name: Reload sshd
  ansible.builtin.shell: 'sshd -t && { systemctl reload ssh 2>/dev/null || systemctl reload sshd; }'
  changed_when: true

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

# Reload all sysctl.d drop-ins. Safe: our file preserves ip_forward=1.
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

# Recompile + load audit rules without restarting auditd (systemd can't restart
# auditd cleanly). Our rules use -f 1 (not -e 2), so they are reloadable.
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
