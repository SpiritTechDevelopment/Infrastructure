---
- name: Validate compiled NodeAgent inputs
  ansible.builtin.assert:
    that:
      - node_agent_image is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - node_agent_grpc_listen is match('^[0-9.]+:[0-9]{1,5}$')
      # The service port carries /metrics without TLS or caller checks. It must
      # bind the management overlay address exactly: a wildcard would publish
      # node state on the public interface.
      - node_agent_http_listen is match('^[0-9.]+:[0-9]{1,5}$')
      - >-
        node_agent_http_listen.split(':')[0]
        == spiritvpn_node_plan.instance.management_address
      - node_agent_allowed_client_identities | length == 1
      - >-
        node_agent_allowed_client_identities[0]
        == 'spiffe://spiritvpn/' ~ spiritvpn_node_plan.environment ~ '/service/backend'
    fail_msg: "NodeAgent requires one digest-pinned image and one environment-bound backend identity."

- name: Require node-local machine PKI before NodeAgent deployment
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ node_agent_certificate_source }}"
    - "{{ node_agent_private_key_source }}"
  register: _node_agent_pki

- name: Validate node-local machine PKI presence
  ansible.builtin.assert:
    that:
      - _node_agent_pki.results | map(attribute='stat.exists') | select('equalto', false) | list | length == 0
      - _node_agent_pki.results | map(attribute='stat.isreg') | select('equalto', false) | list | length == 0
    fail_msg: "NodeAgent machine certificate or node-local private key is missing."

- name: Create persistent NodeAgent state and protected TLS directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ node_agent_state_dir }}"
      owner: "{{ node_agent_uid }}"
      group: "{{ node_agent_gid }}"
      mode: "0700"
    - path: "{{ vpn_stack_dir }}/node-agent"
      owner: root
      group: "{{ node_agent_gid }}"
      mode: "0750"
    - path: "{{ node_agent_tls_dir }}"
      owner: root
      group: "{{ node_agent_gid }}"
      mode: "0750"

- name: Install the public NodeAgent certificate chain
  ansible.builtin.copy:
    src: "{{ node_agent_certificate_source }}"
    dest: "{{ node_agent_tls_dir }}/server-chain.pem"
    remote_src: true
    owner: root
    group: "{{ node_agent_gid }}"
    mode: "0440"
  register: _node_agent_certificate

- name: Install a container-readable copy of the node-local private key
  ansible.builtin.copy:
    src: "{{ node_agent_private_key_source }}"
    dest: "{{ node_agent_tls_dir }}/server.key"
    remote_src: true
    owner: "{{ node_agent_uid }}"
    group: "{{ node_agent_gid }}"
    mode: "0400"
  register: _node_agent_private_key
  no_log: true
  diff: false

- name: Record NodeAgent runtime definition changes
  ansible.builtin.set_fact:
    node_agent_runtime_inputs_changed: >-
      {{ _node_agent_certificate.changed or _node_agent_private_key.changed }}
