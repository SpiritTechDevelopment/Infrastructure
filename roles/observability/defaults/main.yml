---
obs_dir: /opt/observability
platform_bind_address: 0.0.0.0
loki_port: 3100
prometheus_port: 9090
alertmanager_port: 9093
grafana_port: 3000
blackbox_port: 9115
loki_image: grafana/loki:3.7.3
prometheus_image: prom/prometheus:v3.5.0
alertmanager_image: prom/alertmanager:v0.28.1
grafana_image: grafana/grafana:12.0.2
blackbox_image: prom/blackbox-exporter:v0.27.0
alloy_image: grafana/alloy:v1.17.1
node_exporter_image: quay.io/prometheus/node-exporter:v1.9.1
# Host dir node-exporter reads via its textfile collector (mounted at /host<dir>).
# The vault role's seal-metric timer writes vault.prom here; keep in sync with
# roles/vault (node_exporter_textfile_dir).
node_exporter_textfile_dir: /var/lib/node_exporter/textfile-collector
retention_ops: 720h
retention_activity: 168h
alertmanager_webhook_url: ""
# Telegram notifications. bot_token is a SECRET (put it in secrets.sops.yml);
# chat_id is not sensitive (set in group_vars/all.yml or host_vars/control-1).
# The receiver activates only when BOTH are set. See OPERATIONS.md §6.
alertmanager_telegram_bot_token: ""
alertmanager_telegram_chat_id: ""
# Optional forum-supergroup topic/thread to post into (leave empty for the General topic).
alertmanager_telegram_message_thread_id: ""

# Per-user usage exporter: reads Xray StatsService per-user byte counters from
# each entry node and re-exposes them as Prometheus metrics for the top-talkers
# dashboard. Visibility only — durable quota accounting remains the backend's job.
usage_exporter_port: 9110
usage_exporter_interval: 30          # seconds between StatsService polls
usage_exporter_query_timeout: 5      # per-node statsquery timeout (seconds)
usage_exporter_top_n: 50             # cap exported users by total bytes; 0 = export all
# Base image for the exporter runtime. The Xray client binary is copied from
# {{ xray_image }} (global pin in group_vars/all.yml) via a multi-stage build.
usage_exporter_base_image: python:3.12-slim
