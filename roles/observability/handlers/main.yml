---
# Prometheus reads scrape_configs only at startup. Its config is bind-mounted, so
# `docker compose up` does not recreate it when only the config file changes —
# a restart is required to load new scrape jobs or rules.
- name: Restart Prometheus
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ obs_dir }}/compose.yml"
      - restart
      - prometheus
  changed_when: true

# Alertmanager + Grafana also bind-mount their config, so `docker compose up` does
# not reload them on a config-only change. Restart them when their rendered config
# changes (e.g. a new receiver or provisioned datasource).
- name: Restart Alertmanager
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ obs_dir }}/compose.yml"
      - restart
      - alertmanager
  changed_when: true

- name: Restart Grafana
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ obs_dir }}/compose.yml"
      - restart
      - grafana
  changed_when: true
