---
vault_dir: /opt/vault
vault_image: hashicorp/vault:2.0.3
vault_api_port: 8200
vault_cluster_port: 8201
vault_bind_address: 127.0.0.1
vault_tls_enabled: false
vault_api_addr: "{{ ('https' if vault_tls_enabled | bool else 'http') }}://127.0.0.1:{{ vault_api_port }}"
vault_cluster_addr: "{{ ('https' if vault_tls_enabled | bool else 'http') }}://127.0.0.1:{{ vault_cluster_port }}"
vault_tls_certificate: ""
vault_tls_private_key: ""

# Seal-state monitoring: a systemd timer probes /v1/sys/health on the host and
# writes a node-exporter textfile metric (vault_sealed / vault_up) so a silent
# re-seal fires the "VaultSealed" alert. See OPERATIONS.md §9.
vault_seal_metric_enabled: true
# Host path node-exporter reads via its textfile collector. MUST match
# roles/observability (node_exporter_textfile_dir there); node-exporter mounts
# `/:/host:ro`, so it reads this as /host<path>.
node_exporter_textfile_dir: /var/lib/node_exporter/textfile-collector
