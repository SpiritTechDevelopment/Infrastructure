---
- name: Validate the compiled platform-plan locator
  ansible.builtin.assert:
    that:
      - spiritvpn_platform_plan_file is defined
      - spiritvpn_platform_plan_file == 'platform-plan.json'
      - inventory_dir is defined
    fail_msg: "A generated platform inventory must provide the safe platform-plan locator."

- name: Load the generated platform plan on the controller
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/{{ spiritvpn_platform_plan_file }}"
    name: spiritvpn_platform_plan

- name: Validate platform plan and inventory binding
  ansible.builtin.assert:
    that:
      - spiritvpn_platform_plan._notice == 'GENERATED — DO NOT EDIT'
      - spiritvpn_platform_plan.schema_version | int == 1
      - spiritvpn_platform_plan.environment in ['develop', 'staging', 'prod']
      - spiritvpn_platform_plan.platform.id == inventory_hostname
      - spiritvpn_platform_plan.platform.public_address == ansible_host
      - spiritvpn_platform_plan.vault.image is match('^.+@sha256:[0-9a-f]{64}$')
      - spiritvpn_platform_plan.vault.api.bind_address == '127.0.0.1'
      - spiritvpn_platform_plan.github_actions.transport.kind == 'ssh-tunnel'
      - spiritvpn_platform_plan.github_actions.transport.host_key_pinning_required | bool
    fail_msg: "Platform plan is incomplete, mutable, or does not belong to this inventory host."

- name: Require explicit operator bootstrap gates
  ansible.builtin.assert:
    that:
      - spiritvpn_platform_host_key_verified | bool
      - spiritvpn_operator_ssh_public_keys | length > 0
      - spiritvpn_platform_ssh_allowed_cidrs | length > 0
    fail_msg: >-
      Bootstrap requires an independently verified SSH host key, at least one
      reviewed operator/GitHub deployment public key, and explicit SSH source CIDRs.
  when: spiritvpn_platform_plan_mode == 'bootstrap'

- name: Require protected Vault TLS bootstrap values
  ansible.builtin.assert:
    that:
      - spiritvpn_platform_plan.vault.tls.certificate_ref in spiritvpn_platform_bootstrap_secret_values
      - spiritvpn_platform_plan.vault.tls.private_key_ref in spiritvpn_platform_bootstrap_secret_values
      - spiritvpn_platform_bootstrap_secret_values[spiritvpn_platform_plan.vault.tls.certificate_ref] | length > 0
      - spiritvpn_platform_bootstrap_secret_values[spiritvpn_platform_plan.vault.tls.private_key_ref] | length > 0
    fail_msg: "Vault TLS bootstrap references were not resolved by the operator input."
  no_log: true
  when: spiritvpn_platform_plan_mode == 'bootstrap'

- name: Map compiled non-secret platform inputs
  ansible.builtin.set_fact:
    platform_vault_dir: /opt/spiritvpn/platform/vault
    platform_vault_image: "{{ spiritvpn_platform_plan.vault.image }}"
    platform_vault_api_port: "{{ spiritvpn_platform_plan.vault.api.port }}"
    platform_vault_cluster_port: "{{ spiritvpn_platform_plan.vault.cluster.port }}"
    platform_vault_tls_server_name: "{{ spiritvpn_platform_plan.vault.api.tls_server_name }}"
    platform_vault_node_id: "{{ spiritvpn_platform_plan.vault.storage.node_id }}"

- name: Map compiled bootstrap and secret inputs
  ansible.builtin.set_fact:
    deploy_mode: bootstrap
    common_manage_deploy_user: true
    common_authorized_keys: "{{ spiritvpn_operator_ssh_public_keys }}"
    common_manage_sshd: true
    common_manage_firewall: true
    common_enable_fail2ban: true
    common_manage_sysctl: true
    common_enable_unattended_upgrades: true
    common_enable_auditd: true
    common_public_tcp_ports: []
    common_public_udp_ports: []
    ssh_allowed_cidrs: "{{ spiritvpn_platform_ssh_allowed_cidrs }}"
    common_fail2ban_ignoreip: >-
      127.0.0.1/8 ::1 {{ spiritvpn_platform_ssh_allowed_cidrs | join(' ') }}
    platform_vault_tls_certificate: >-
      {{ spiritvpn_platform_bootstrap_secret_values[
           spiritvpn_platform_plan.vault.tls.certificate_ref] }}
    platform_vault_tls_private_key: >-
      {{ spiritvpn_platform_bootstrap_secret_values[
           spiritvpn_platform_plan.vault.tls.private_key_ref] }}
  no_log: true
  when: spiritvpn_platform_plan_mode == 'bootstrap'
