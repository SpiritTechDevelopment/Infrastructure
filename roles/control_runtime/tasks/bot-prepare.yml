---
# Everything the bot needs on disk before anything is started. Included rather
# than guarded task-by-task: `loop` is templated before `when` is evaluated, so
# a `when: control_plan.bot` on a task looping over `control_plan.bot.paths`
# would still fail on an environment that declares no bot.

- name: Validate the generated bot boundary
  ansible.builtin.assert:
    that:
      - control_plan.bot.source_git_sha is match('^[0-9a-f]{40}$')
      - control_plan.bot.image is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        control_plan.bot.ingress.tunnel_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      # One instance, two tenants. A repeated name here would point the bot's
      # migrations at the backend's schema.
      - control_plan.bot.postgres.database != control_plan.postgres.database
      - control_plan.bot.postgres.owner_user != control_plan.bot.postgres.runtime_user
      - control_plan.bot.postgres.owner_user != control_plan.postgres.owner_user
      - control_plan.bot.postgres.runtime_user != control_plan.postgres.runtime_user
      - control_plan.bot.settings.friends_plan_fleet_id | int > 0
      - control_plan.bot.ingress.public_origin.startswith('https://')
    fail_msg: "The generated bot plan is incomplete, unpinned, or collides with the backend."

# Полнота и форма значений проверены резолвером. Здесь проверяются только
# файлы: их называет сама роль и указывает на них в bot.env, поэтому пропущенное
# поле — ошибка проводки, и назвать её надо здесь, а не в Jinja.
- name: Require the bot secret files this role wires into the container
  ansible.builtin.assert:
    that:
      - control_bot_required_files | difference(control_bot_files.keys() | list) | length == 0
    fail_msg: >-
      В объекте Vault kv/{{ control_plan.environment }}/control/bot/files нет полей:
      {{ control_bot_required_files | difference(control_bot_files.keys() | list) | join(', ') }}

# Непустое значение — ещё не сертификат. Церемония записи читает до EOF, поэтому
# невставленный файл сохраняет один перевод строки: он проходит проверку на
# пустоту и падает тремя тасками позже как `Unable to load certificate`, указывая
# на файл вместо того, как его заполняли.
- name: Require bot PEM secrets to actually be PEM
  ansible.builtin.assert:
    that:
      - "'-----BEGIN ' in control_bot_files[item]"
      - "'-----END ' in control_bot_files[item]"
    fail_msg: >-
      Поле {{ item }} не содержит блок PEM. Перезапишите его, подав файл в
      церемонию записи, а не вставкой в терминал.
  loop: "{{ control_bot_required_files }}"
  no_log: true

- name: Create protected bot runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ control_plan.bot.paths.root }}"
      owner: root
      group: root
      mode: "0700"
    - path: "{{ control_plan.bot.paths.secrets }}"
      owner: root
      group: "{{ control_bot_gid }}"
      mode: "0750"

- name: Install protected bot secret files
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ control_plan.bot.paths.secrets }}/{{ item.key }}"
    owner: "{{ control_bot_uid }}"
    group: "{{ control_bot_gid }}"
    mode: "0400"
  loop: "{{ control_bot_files | dict2items }}"
  register: _control_bot_secret_files
  no_log: true
  diff: false

- name: Validate bot certificate lifetimes
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ control_plan.bot.paths.secrets }}/{{ item }}"
      - -noout
      - -checkend
      - "{{ control_tls_minimum_validity_seconds | string }}"
  loop:
    - client.crt
    - server-ca.crt
  changed_when: false
  when: not ansible_check_mode

- name: Read the bot client certificate identity
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ control_plan.bot.paths.secrets }}/client.crt"
      - -noout
      - -text
  register: _control_bot_client_certificate
  changed_when: false
  when: not ansible_check_mode

# The backend authorises by SPIFFE URI. A certificate carrying a different one
# yields a bot that connects and is refused on every call — a failure that only
# shows up in traffic, not in the deployment.
- name: Require the declared bot identity in its client certificate
  ansible.builtin.assert:
    that:
      - >-
        ('URI:' ~ control_plan.bot.settings.client_identity)
        in _control_bot_client_certificate.stdout
    fail_msg: "The bot client certificate does not carry its declared identity."
  when: not ansible_check_mode

- name: Read the public key from the bot client certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ control_plan.bot.paths.secrets }}/client.crt"
      - -pubkey
      - -noout
  register: _control_bot_certificate_public_key
  changed_when: false
  when: not ansible_check_mode

- name: Derive the public key from the protected bot private key
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -in
      - "{{ control_plan.bot.paths.secrets }}/client.key"
      - -pubout
  register: _control_bot_private_key_public_key
  changed_when: false
  no_log: true
  when: not ansible_check_mode

- name: Require the bot certificate and private key to match
  ansible.builtin.assert:
    that:
      - >-
        (_control_bot_certificate_public_key.stdout | trim)
        == (_control_bot_private_key_public_key.stdout | trim)
    fail_msg: "The bot client certificate and private key are not a pair."
  no_log: true
  when: not ansible_check_mode

# Проводка бота из отревьюенной топологии: адрес бэкенда, порт, пути к файлам
# внутри контейнера и параметры тарифа. Секретов здесь нет, поэтому и в Vault им
# не место — иначе адрес, на который бот ходит, менялся бы без диффа.
- name: Collect the bot environment owned by the reviewed topology
  ansible.builtin.set_fact:
    _control_bot_wiring: >-
      {{
        {
          'BOT_SPIRITVPND_GRPC_TARGET': control_plan.bot.network.backend_target,
          'BOT_SPIRITVPND_TLS_CLIENT_CERT_FILE': '/secrets/client.crt',
          'BOT_SPIRITVPND_TLS_CLIENT_KEY_FILE': '/secrets/client.key',
          'BOT_SPIRITVPND_TLS_CA_FILE': '/secrets/server-ca.crt',
          'BOT_SUBSCRIPTION_BASE_URL': control_plan.bot.settings.subscription_base_url,
          'BOT_MINI_APP_URL': control_plan.bot.settings.mini_app_url,
          'BOT_MINI_APP_HTTP_PORT': control_plan.bot.network.http_port,
          'BOT_FRIENDS_PLAN_FLEET_ID': control_plan.bot.settings.friends_plan_fleet_id,
        }
        | combine(
            {'BOT_FRIENDS_PLAN_QUOTA_BYTES': control_plan.bot.settings.friends_plan_quota_bytes}
            if 'friends_plan_quota_bytes' in control_plan.bot.settings else {}
          )
        | combine(
            {'BOT_FRIENDS_PLAN_DURATION_DAYS': control_plan.bot.settings.friends_plan_duration_days}
            if 'friends_plan_duration_days' in control_plan.bot.settings else {}
          )
      }}

- name: Refuse a bot key claimed by both the topology and Vault
  ansible.builtin.assert:
    that:
      - _control_bot_wiring.keys() | list | intersect(control_bot_env.keys() | list) | length == 0
    fail_msg: >-
      Ключ объявлен и в топологии, и в Vault:
      {{ _control_bot_wiring.keys() | list | intersect(control_bot_env.keys() | list) | join(', ') }}

- name: Render protected bot environment
  ansible.builtin.copy:
    content: |
      {% for key, value in (_control_bot_wiring | combine(control_bot_env)) | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ control_plan.bot.paths.root }}/bot.env"
    owner: root
    group: root
    mode: "0600"
  register: _control_bot_environment
  no_log: true
  diff: false

- name: Render protected bot migration environment
  ansible.builtin.copy:
    content: |
      {% for key, value in control_bot_migration_env | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ control_plan.bot.paths.root }}/migration.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false

- name: Render the protected tunnel environment
  ansible.builtin.copy:
    content: |
      {% for key, value in control_bot_tunnel_env | dictsort %}
      {{ key }}={{ value }}
      {% endfor %}
    dest: "{{ control_plan.bot.paths.root }}/tunnel.env"
    owner: root
    group: root
    mode: "0600"
  register: _control_bot_tunnel_environment
  no_log: true
  diff: false
