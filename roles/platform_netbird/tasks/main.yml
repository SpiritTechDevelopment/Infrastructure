---
- name: Validate the management overlay inputs
  ansible.builtin.assert:
    that:
      # Тег вместо digest означал бы, что перезапуск может принести другой
      # управляющий сервер — тот самый, через который ходит вся выкатка.
      - >-
        platform_netbird_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        platform_netbird_dashboard_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - >-
        platform_netbird_proxy_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      # Адрес в listenAddress сервер игнорирует: при `127.0.0.1:8081` он всё
      # равно слушает `*:8081`, проверено через ss на живом хабе. Дисциплина
      # bind здесь, как и у метрик, недоступна — порт держит вне интернета одно
      # правило firewall, поэтому он обязан оставаться необъявленным публично.
      # Переменная задаёт адрес, по которому к серверу обращается прокси.
      - platform_netbird_http_port | int not in (common_public_tcp_ports | map('int') | list)
      - platform_netbird_hostname | length > 0
      - platform_netbird_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9]$')
      - platform_netbird_owner_email | length > 0
      - platform_netbird_network | length > 0
      # Healthcheck принимает адрес, и он уводится на петлю.
      #
      # Метрики — нет: `metricsPort` задаёт только порт, и сервер слушает их на
      # всех интерфейсах. Проверено по логу первого запуска: «running metrics
      # server: :9099/metrics». Слоя bind здесь не существует, и единственное,
      # что держит метрики контура вне интернета, — правило firewall. Поэтому
      # порт обязан оставаться вне common_public_tcp_ports; переменной с
      # адресом здесь нет намеренно, чтобы не обещать несуществующего.
      - platform_netbird_healthcheck_bind_address == '127.0.0.1'
      - platform_netbird_metrics_port | int not in (common_public_tcp_ports | map('int') | list)
      # 9090 — Prometheus этого же хаба. Совпадение портов на сети хоста
      # означает не деградацию, а неподнявшийся контейнер.
      - platform_netbird_metrics_port | int != platform_prometheus_port | int
      - platform_netbird_metrics_port | int not in [platform_node_exporter_port | int, platform_alertmanager_port | int]
    fail_msg: "The management overlay inputs are incomplete or unsafe."

# Отдельным блоком, а не строками в общей проверке выше: клиент выключен по
# умолчанию, и требования к нему предъявляются только когда его включили.
- name: Validate the overlay client inputs
  ansible.builtin.assert:
    that:
      - >-
        platform_netbird_client_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - platform_netbird_client_peer_hostname | length > 0
      - platform_netbird_client_interface | length > 0
    fail_msg: >-
      The overlay client is enabled but its image is unpinned or absent.
      Declare the netbird_client component in the common desired state first;
      until it is declared the pin stays empty by design.
  when: platform_netbird_client_enabled

- name: Require the overlay client registration key to be present on the hub
  ansible.builtin.stat:
    path: "{{ platform_netbird_client_setup_key_file }}"
  register: _platform_netbird_client_setup_key
  when: platform_netbird_client_enabled

# Ключ выпускает сервер, а не объявляет Git, поэтому здесь его отсутствие —
# незаконченная ручная процедура, а не поломка. Сообщение называет её целиком:
# оператор читает его в тот момент, когда чинит выкатку.
- name: Refuse to start the overlay client without a registration key
  ansible.builtin.assert:
    that:
      - _platform_netbird_client_setup_key.stat.exists
    fail_msg: >-
      The overlay client registration key is missing at
      {{ platform_netbird_client_setup_key_file }}.
      Issue a setup key from the NetBird dashboard and place it there as a
      single line, readable by root only. The key is a runtime fact issued by
      the server, so it is delivered as a file and never through Git.
  when: platform_netbird_client_enabled

- name: Require the TLS material to be present on the hub
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_netbird_tls_certificate_file }}"
    - "{{ platform_netbird_tls_private_key_file }}"
  register: _platform_netbird_tls

- name: Refuse to start the overlay without its certificate
  ansible.builtin.assert:
    that:
      - _platform_netbird_tls_missing | length == 0
    # Пути называются поимённо: их два, и «чего-то не хватает» заставляет
    # оператора гадать ровно в тот момент, когда он и так чинит выкатку.
    fail_msg: >-
      TLS material is missing on the hub: {{ _platform_netbird_tls_missing | join(', ') }}.
      Place the wildcard certificate and its key at those paths before deploying;
      they are delivered as files, never through Ansible variables.
  vars:
    _platform_netbird_tls_missing: >-
      {{ _platform_netbird_tls.results
         | rejectattr('stat.exists')
         | map(attribute='item')
         | list }}

- name: Create the management overlay directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: >-
    {{ [platform_netbird_dir, platform_netbird_data_dir]
       + ([platform_netbird_client_data_dir] if platform_netbird_client_enabled else []) }}

# Секреты заводятся один раз и переживают выкатки. Пересозданный authSecret
# порвал бы relay для уже подключённых peer'ов, а новый encryptionKey сделал бы
# нечитаемым store — то есть стёр бы весь ростер. `creates` здесь не
# оптимизация, а условие безопасности.
- name: Generate the overlay secrets once
  ansible.builtin.shell:
    cmd: >-
      (umask 077 && openssl rand -base64 32 | tr -d '\n'
      > {{ item | quote }})
    creates: "{{ item }}"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"

- name: Restrict the overlay secrets to root
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"

- name: Read the overlay secrets for the rendered configuration
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"
  register: _platform_netbird_secrets
  no_log: true
  when: not ansible_check_mode

- name: Render the management overlay configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ platform_netbird_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  register: _platform_netbird_config
  vars:
    platform_netbird_auth_secret: >-
      {{ (_platform_netbird_secrets.results[0].content | b64decode) | trim }}
    platform_netbird_store_encryption_key: >-
      {{ (_platform_netbird_secrets.results[1].content | b64decode) | trim }}
    platform_netbird_owner_password: >-
      {{ (_platform_netbird_secrets.results[2].content | b64decode) | trim }}
  no_log: true
  when: not ansible_check_mode

- name: Render the management overlay reverse proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ platform_netbird_dir }}/nginx.conf"
    owner: root
    group: root
    mode: "0600"
  register: _platform_netbird_proxy_config

- name: Render the management overlay compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ platform_netbird_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"

# Пересоздание, а не просто `up`, когда изменилась отрендеренная конфигурация.
# Compose сравнивает определение сервиса и содержимое смонтированных файлов не
# хеширует: правка config.yaml сама по себе оставила бы сервер работать со
# старым. Найдено дорого — сервер остался слушать 443 со старой настройкой, и
# прокси не смог занять порт: «bind() to 0.0.0.0:443 failed (98: Address in
# use)».
- name: Reconcile the management overlay
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', platform_netbird_dir ~ '/compose.yml', 'up', '-d']
         + (['--force-recreate'] if _platform_netbird_rendered_changed else [])
         + ['--wait'] }}
  vars:
    _platform_netbird_rendered_changed: >-
      {{ (_platform_netbird_config.changed | default(false))
         or (_platform_netbird_proxy_config.changed | default(false)) }}
  changed_when: true
  when: not ansible_check_mode

# Проверяется поле certificate_valid, а не код ответа, и 503 считается
# допустимым. Причина в устройстве самой проверки
# (relay/healthcheck/healthcheck.go v0.76.3): статус становится unhealthy, если
# `len(listeners) == 0`, а при мультиплексировании relay на порт management
# своего слушателя у него нет вовсе — «no separate relay listener». То есть 200
# отсюда не придёт никогда, и ждать его значит ждать вечно.
#
# certificate_valid при этом — сильное утверждение, а не слабое: оно
# выставляется в false, если схема не rels:// или если не удалось дозвониться
# по публичному адресу. Истина здесь означает, что путь пройден целиком: TLS на
# прокси, маршрут WebSocket, ответ relay.
- name: Require the management overlay to complete a TLS round trip
  ansible.builtin.uri:
    url: >-
      http://{{ platform_netbird_healthcheck_bind_address }}:{{
      platform_netbird_healthcheck_port }}/health
    method: GET
    status_code: [200, 503]
    return_content: true
    timeout: 5
  register: _platform_netbird_readiness
  retries: 12
  delay: 5
  until: _platform_netbird_readiness.json.certificate_valid | default(false)
  changed_when: false
  when: not ansible_check_mode

# Утверждается, а не предполагается. Запустившийся контейнер клиента ничего не
# доказывает: регистрация могла не пройти по протухшему ключу или исчерпанному
# лимиту использований, и тогда роль осталась бы зелёной при пустом оверлее —
# ровно тот отказ, который не находится, потому что ничего не ломает.
#
# Адрес читается с интерфейса, а не из `netbird status`: интерфейс с адресом и
# есть то, на что опирается правило firewall.
#
# Проверяется наличие адреса, а не его принадлежность объявленной сети. Второе
# потребовало бы фильтра `ipaddr` из ansible.utils, а этой коллекции в контуре
# нет — ставить её на хаб ради одной проверки дороже, чем она стоит. Нужный
# отказ ловится и так: незарегистрировавшийся клиент не поднимает интерфейс
# вовсе, и адреса нет никакого.
- name: Require the hub to hold an address in the management overlay
  ansible.builtin.command:
    argv:
      - ip
      - -4
      - -oneline
      - address
      - show
      - dev
      - "{{ platform_netbird_client_interface }}"
  register: _platform_netbird_client_address
  retries: 12
  delay: 5
  until: >-
    _platform_netbird_client_address.rc == 0
    and 'inet ' in _platform_netbird_client_address.stdout
  changed_when: false
  failed_when: false
  when:
    - platform_netbird_client_enabled
    - not ansible_check_mode

- name: Report an overlay client that never joined the network
  ansible.builtin.assert:
    that:
      - _platform_netbird_client_address.rc | default(1) == 0
      - "'inet ' in _platform_netbird_client_address.stdout | default('')"
    fail_msg: >-
      The overlay client did not obtain an address on
      {{ platform_netbird_client_interface }}.
      The usual cause is a spent or expired setup key; `docker compose -f
      {{ platform_netbird_dir }}/compose.yml logs client` names it.
  when:
    - platform_netbird_client_enabled
    - not ansible_check_mode
