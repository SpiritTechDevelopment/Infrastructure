---
- name: Validate the management overlay inputs
  ansible.builtin.assert:
    that:
      # Тег вместо digest означал бы, что перезапуск может принести другой
      # управляющий сервер — тот самый, через который ходит вся выкатка.
      - >-
        platform_netbird_image
        is match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
      - platform_netbird_hostname | length > 0
      - platform_netbird_hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]{0,251}[A-Za-z0-9]$')
      - platform_netbird_owner_email | length > 0
      - platform_netbird_network | length > 0
      # Healthcheck принимает адрес, и он уводится на петлю.
      #
      # Метрики — нет: `metricsPort` задаёт только порт, и сервер слушает их на
      # всех интерфейсах. Проверено по логу первого запуска: «running metrics
      # server: :9099/metrics». Слоя bind здесь не существует, и единственное,
      # что держит метрики контура вне интернета, — правило firewall. Поэтому
      # порт обязан оставаться вне common_public_tcp_ports; переменной с
      # адресом здесь нет намеренно, чтобы не обещать несуществующего.
      - platform_netbird_healthcheck_bind_address == '127.0.0.1'
      - platform_netbird_metrics_port | int not in (common_public_tcp_ports | map('int') | list)
      # 9090 — Prometheus этого же хаба. Совпадение портов на сети хоста
      # означает не деградацию, а неподнявшийся контейнер.
      - platform_netbird_metrics_port | int != platform_prometheus_port | int
      - platform_netbird_metrics_port | int not in [platform_node_exporter_port | int, platform_alertmanager_port | int]
    fail_msg: "The management overlay inputs are incomplete or unsafe."

- name: Require the TLS material to be present on the hub
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ platform_netbird_tls_certificate_file }}"
    - "{{ platform_netbird_tls_private_key_file }}"
  register: _platform_netbird_tls

- name: Refuse to start the overlay without its certificate
  ansible.builtin.assert:
    that:
      - _platform_netbird_tls_missing | length == 0
    # Пути называются поимённо: их два, и «чего-то не хватает» заставляет
    # оператора гадать ровно в тот момент, когда он и так чинит выкатку.
    fail_msg: >-
      TLS material is missing on the hub: {{ _platform_netbird_tls_missing | join(', ') }}.
      Place the wildcard certificate and its key at those paths before deploying;
      they are delivered as files, never through Ansible variables.
  vars:
    _platform_netbird_tls_missing: >-
      {{ _platform_netbird_tls.results
         | rejectattr('stat.exists')
         | map(attribute='item')
         | list }}

- name: Create the management overlay directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ platform_netbird_dir }}"
    - "{{ platform_netbird_data_dir }}"

# Секреты заводятся один раз и переживают выкатки. Пересозданный authSecret
# порвал бы relay для уже подключённых peer'ов, а новый encryptionKey сделал бы
# нечитаемым store — то есть стёр бы весь ростер. `creates` здесь не
# оптимизация, а условие безопасности.
- name: Generate the overlay secrets once
  ansible.builtin.shell:
    cmd: >-
      (umask 077 && openssl rand -base64 32 | tr -d '\n'
      > {{ item | quote }})
    creates: "{{ item }}"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"

- name: Restrict the overlay secrets to root
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"

- name: Read the overlay secrets for the rendered configuration
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ platform_netbird_auth_secret_file }}"
    - "{{ platform_netbird_store_encryption_key_file }}"
    - "{{ platform_netbird_owner_password_file }}"
  register: _platform_netbird_secrets
  no_log: true
  when: not ansible_check_mode

- name: Render the management overlay configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ platform_netbird_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  vars:
    platform_netbird_auth_secret: >-
      {{ (_platform_netbird_secrets.results[0].content | b64decode) | trim }}
    platform_netbird_store_encryption_key: >-
      {{ (_platform_netbird_secrets.results[1].content | b64decode) | trim }}
    platform_netbird_owner_password: >-
      {{ (_platform_netbird_secrets.results[2].content | b64decode) | trim }}
  no_log: true
  when: not ansible_check_mode

- name: Render the management overlay compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ platform_netbird_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"

- name: Reconcile the management overlay
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ platform_netbird_dir }}/compose.yml"
      - up
      - -d
      - --wait
  changed_when: true
  when: not ansible_check_mode

- name: Require the management overlay to answer on loopback
  ansible.builtin.uri:
    # Путь именно /health: в корне сервер отдаёт не его. Взято из лога
    # запуска — «starting healthcheck server on: http://127.0.0.1:9000/health».
    url: >-
      http://{{ platform_netbird_healthcheck_bind_address }}:{{
      platform_netbird_healthcheck_port }}/health
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: _platform_netbird_readiness
  retries: 12
  delay: 5
  until: _platform_netbird_readiness.status == 200
  changed_when: false
  when: not ansible_check_mode
