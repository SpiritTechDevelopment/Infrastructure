---
# Управляющий overlay контура. Заменяет WireGuard в роли транспорта; сам
# WireGuard остаётся спящим break-glass, см. docs/architecture/NETBIRD_MIGRATION.md.

# Пустой по умолчанию: образ обязан приезжать закреплённым по digest из
# desired/common/components.yml через scripts/platform-component-vars.py.
# Роль отказывается работать с тегом.
platform_netbird_image: ""

platform_netbird_dir: /etc/spiritvpn/netbird
platform_netbird_data_dir: /var/lib/spiritvpn/netbird

# Публичное имя хаба. Оно же идёт в exposedAddress и в issuer встроенного IdP,
# поэтому обязано совпадать с A-записью и с SAN сертификата.
platform_netbird_hostname: ""

# 443 держит nginx, а не сам NetBird. Combined-сервер TLS на своём основном
# слушателе не терминирует: `handleTLSConfig` загружает сертификат, но
# вызывающий код результат отбрасывает и оставляет лишь признак для relay.
# Проверено по исходнику v0.76.3 и подтверждено на живом сервере, который отдал
# простой HTTP на 443.
platform_netbird_listen_port: 443

# Сам сервер и дашборд слушают петлю; наружу их выводит прокси.
platform_netbird_http_bind_address: 127.0.0.1
platform_netbird_http_port: 8081
platform_netbird_dashboard_port: 8080

# Дашборд — отдельный контейнер, не часть combined-образа.
platform_netbird_dashboard_image: ""
# Терминатор TLS. Образ переиспользуется из компонента nginx_mask: это тот же
# nginx, и второй pin того же софта означал бы две версии на один контур.
platform_netbird_proxy_image: ""
# STUN. Проксировать UDP нельзя, поэтому порт публичный; цена принята
# сознательно (раздел 3.7 документа о переходе).
platform_netbird_stun_port: 3478

# По умолчанию у NetBird metricsPort = 9090, а это порт Prometheus на хабе:
# совпадение означало бы неподнявшийся контейнер.
#
# Адреса у метрик нет — конфигурация принимает только порт, и сервер слушает на
# всех интерфейсах. Значит дисциплина bind к ним неприменима, и вне интернета их
# держит одно правило firewall. Порт не должен попадать в common_public_tcp_ports.
platform_netbird_metrics_port: 9099
platform_netbird_healthcheck_bind_address: 127.0.0.1
platform_netbird_healthcheck_port: 9000

# TLS терминирует обратный прокси, а не сервер (см. platform_netbird_listen_port
# выше). Материал подаётся файлами, уже лежащими на хабе, а не переменными:
# приватный ключ не должен проходить через факты Ansible и через SOPS-бандл
# третьей копией.
platform_netbird_tls_certificate_file: /etc/spiritvpn/netbird/tls/fullchain.pem
platform_netbird_tls_private_key_file: /etc/spiritvpn/netbird/tls/privkey.pem

# Секреты, которые сервер принимает значениями, а не путями. Заводятся на хабе
# один раз и переживают выкатки — как пароль администратора Grafana рядом.
# Пересоздание разлогинило бы операторов и порвало бы relay.
platform_netbird_auth_secret_file: /var/lib/spiritvpn/netbird-auth-secret
platform_netbird_store_encryption_key_file: /var/lib/spiritvpn/netbird-store-encryption-key

# Первый администратор встроенного IdP. Пароль генерируется здесь же и
# показывается оператору один раз — сменить его следует после первого входа.
platform_netbird_owner_email: ""
platform_netbird_owner_password_file: /var/lib/spiritvpn/netbird-owner-password

# Оверлейная сеть NetBird. Объявляется, а не выясняется: адрес резолвера и
# доверенные peer-сети — чистые функции от неё.
platform_netbird_network: ""

platform_netbird_log_level: info
platform_netbird_log_max_size: 10m
platform_netbird_log_max_files: "3"

# --- Клиент оверлея на самом хабе --------------------------------------------
#
# Сервер NetBird в собственную сеть не входит: сеть образуют клиенты. Без этого
# блока у хаба нет адреса в оверлее, подключившийся оператор оказывается в сети,
# где он единственный peer, и до Grafana с Vault добраться нечем.
#
# Выключено по умолчанию, потому что включение требует ключа регистрации, а тот
# выпускается из дашборда уже работающего сервера. Первый прогон роли обязан
# проходить без него.
platform_netbird_client_enabled: false

# Пустой по умолчанию, как и остальные образы: приезжает закреплённым по digest.
# Компонент netbird_client объявлен необязательным в
# scripts/platform-component-vars.py, поэтому до его появления в общем desired
# state значение остаётся пустым, а роль отказывается включать клиента.
platform_netbird_client_image: ""

# Состояние клиента: default.json и active_profile.json. Путь взят из
# `profilemanager.DefaultConfigPathDir` v0.76.3, а не из документации. `/etc/netbird`
# там же назван старым путём, с которого делается миграция, — монтировать надо
# именно этот. Ошибка стоила бы регистрации нового peer'а на каждый перезапуск.
platform_netbird_client_data_dir: /var/lib/spiritvpn/netbird-client

# Ключ регистрации — рантайм-факт: его выпускает сервер, а не объявляет Git.
# Подаётся файлом по той же причине и тем же способом, что TLS-материал выше;
# клиент умеет читать его сам через --setup-key-file, поэтому секрет не проходит
# ни через compose.yml, ни через окружение контейнера.
platform_netbird_client_setup_key_file: /var/lib/spiritvpn/netbird-client-setup-key

# Имя хаба как peer'а. Оно же станет именем в DNS оверлея, поэтому меняет смысл
# при смене: раздел 3.1 документа о переходе строит адресацию по именам.
platform_netbird_client_peer_hostname: management-1

# Интерфейс, который поднимает клиент. Значение по умолчанию у NetBird — wt0;
# объявлено здесь, потому что на него ссылается правило firewall.
platform_netbird_client_interface: wt0
