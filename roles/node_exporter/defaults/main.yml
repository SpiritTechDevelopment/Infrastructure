---
# Supplied by the compiled node plan as repository@digest. Empty here so a
# role used without its plan fails instead of silently running a tag.
node_exporter_image: ""
node_exporter_bind_address: 127.0.0.1
node_exporter_port: 9100
node_exporter_listen: "{{ node_exporter_bind_address }}:{{ node_exporter_port }}"
