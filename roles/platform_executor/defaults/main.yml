---
platform_github_user: github-deploy
platform_github_ssh_keys: []
platform_vault_dir: /opt/spiritvpn/platform/vault
platform_vault_api_port: 8200
platform_vault_tls_server_name: vault.management.internal
platform_executor_dir: /opt/spiritvpn/platform/executor
platform_executor_state_dir: /var/lib/spiritvpn/fleetctl
platform_executor_config_dir: /etc/spiritvpn/deploy
platform_executor_bundle_limit_kib: 262144
platform_executor_python_packages:
  - ansible-core>=2.18,<2.19
  - PyYAML>=6,<7
  - jsonschema>=4.18,<5
