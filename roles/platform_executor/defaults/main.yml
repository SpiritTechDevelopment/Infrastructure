---
platform_github_user: github-deploy
platform_github_ssh_keys: []
platform_vault_dir: /opt/spiritvpn/platform/vault
platform_vault_api_port: 8200
platform_vault_tls_server_name: vault.management.internal
platform_executor_dir: /opt/spiritvpn/platform/executor
platform_executor_state_dir: /var/lib/spiritvpn/fleetctl
platform_executor_config_dir: /etc/spiritvpn/deploy
platform_runtime_config_dir: /etc/spiritvpn/platform
platform_runtime_vars_file: /etc/spiritvpn/platform/runtime-vars.yml
platform_executor_bundle_limit_kib: 262144
# Keep the deployment runtime independent from Ubuntu's system Python.
# ansible-core 2.18 requires Python 3.11 or newer.
platform_executor_python_minimum_minor: 11
platform_executor_python_executable: /usr/bin/python3.11
platform_executor_python_apt_packages: [python3.11, python3.11-venv]
platform_executor_python_packages:
  - ansible-core>=2.18,<2.19
  - PyYAML>=6,<7
  - jsonschema>=4.18,<5
  # Отправка манифеста бэкенду по вендоренному контракту. Импортируются лениво:
  # всё остальное — валидация, рендер, план, проверки — работает без них.
  #
  # protobuf закреплён под версию генератора: сгенерированный код в fleetctl/gen
  # сверяет версию рантайма при импорте и падает на несовпадении. Меняя одно,
  # меняй второе и перегенерируй стабы.
  - grpcio>=1.83,<2
  - protobuf>=7.35,<8
