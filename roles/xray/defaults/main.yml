---
# Xray VLESS + REALITY runtime. Infrastructure owns the process, base config,
# REALITY identity and entry/exit topology. The backend owns runtime customer users.
vpn_stack_dir: /opt/vpn
# Supplied by the compiled node plan as repository@digest. Empty here so a
# role used without its plan fails instead of silently running a tag.
xray_image: ""
xray_config_dir: "{{ vpn_stack_dir }}/xray"

public_port: 443
xray_listen_port: "{{ public_port }}"
xray_loglevel: info
# 'none' disables the log. An empty string would send it to stdout, so the
# safe default for a record of client addresses and destinations is not "".
xray_access_log: none
xray_error_log: ""
xray_mask_address: ""
xray_stats_user_traffic: true

# The API is loopback-only because Xray has no application-layer authentication.
xray_enable_api: true
xray_api_bind: 127.0.0.1
xray_api_port: 10085
xray_api_services:
  - HandlerService
  - RoutingService
  - StatsService
  - ReflectionService

# Local expvar/pprof endpoint for diagnostics. It is not exposed publicly.
xray_metrics_enabled: true
xray_metrics_bind: 127.0.0.1
xray_metrics_port: 11111

# REALITY identity is resolved from the logical-node Vault reference.
mask_bind_address: 127.0.0.1
mask_port: 8443
reality_dest: "{{ mask_bind_address }}:{{ mask_port }}"
reality_server_names: []
reality_short_ids: []
reality_private_key: ""

# Infrastructure/service identities only. Customer users are added at runtime.
xray_static_clients: []

# Entry-only exit outbounds are compiled from fleet bridge relations.
entry_exits: []
entry_default_exit_tag: ""
xray_entry_block_unmatched: true
xray_manage_routing_via_agent: true
xray_inbound_tag: vless-in
xray_direct_outbound_tag: direct
xray_block_outbound_tag: block

xray_domain_strategy: AsIs
xray_dns_servers: []
xray_block_domains: []
xray_sniffing_route_only: true
