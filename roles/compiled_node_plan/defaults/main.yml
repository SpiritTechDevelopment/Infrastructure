---
# Secret values are supplied by the protected deployment adapter and keyed by
# the secret:// references in the compiled node plan. They are never rendered
# into generated artifacts.
spiritvpn_secret_values: {}
spiritvpn_require_runtime_secrets: true
spiritvpn_deployment_user: deploy
spiritvpn_deploy_mode: hardened
spiritvpn_manage_deploy_user: false
spiritvpn_operator_ssh_public_keys: []
# Public certificate chains returned by the operator/CA ceremony, keyed by
# instance ID. Private machine keys remain node-local.
spiritvpn_agent_certificate_chains: {}

# Exit-нода сверяет видимый снаружи адрес с собственным: это доказывает не
# только выход в интернет, но и что выход идёт под её адресом — проксированный
# или заNATенный ответит другим.
#
# Точка сторонняя, и цена этого известна: каждый прогон readiness показывает ей
# адреса нод. Свой эндпоинт ничего бы не сообщал, но его пришлось бы
# разворачивать и поддерживать.
spiritvpn_smoke_echo_url: https://api.ipify.org
spiritvpn_smoke_curl_timeout_seconds: 10
