---
- name: Validate compiled machine identity
  ansible.builtin.assert:
    that:
      - pki_agent_identity == 'spiffe://spiritvpn/' ~ spiritvpn_node_plan.environment ~ '/instance/' ~ spiritvpn_node_plan.instance.id
      # The backend dials this node with ServerName set and full verification
      # (SpiritVPN/internal/nodeagent/tls.go), so the certificate needs the host
      # name as well as the identity. An identity-only certificate fails the
      # handshake before either side looks at the SAN it does carry.
      - pki_agent_server_name == spiritvpn_node_plan.instance.id ~ '.agent.' ~ spiritvpn_node_plan.environment ~ '.internal'
    fail_msg: "Machine certificate must carry the compiled SPIFFE identity and the compiled TLS server name."

- name: Create protected agent PKI directory
  ansible.builtin.file:
    path: "{{ pki_agent_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect node-local agent private key
  ansible.builtin.stat:
    path: "{{ pki_agent_private_key_path }}"
  register: _pki_agent_private_key

- name: Generate agent private key entirely on the node
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - EC
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -out
      - "{{ pki_agent_private_key_path }}"
  when: not _pki_agent_private_key.stat.exists
  changed_when: true
  no_log: true

- name: Protect node-local agent private key
  ansible.builtin.file:
    path: "{{ pki_agent_private_key_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Inspect agent CSR
  ansible.builtin.stat:
    path: "{{ pki_agent_csr_path }}"
  register: _pki_agent_csr

- name: Generate CSR locally from the non-exported private key
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -key
      - "{{ pki_agent_private_key_path }}"
      - -out
      - "{{ pki_agent_csr_path }}"
      - -subj
      - "/CN={{ spiritvpn_node_plan.instance.id }}"
      - -addext
      - "subjectAltName=DNS:{{ pki_agent_server_name }},URI:{{ pki_agent_identity }}"
  when: not _pki_agent_csr.stat.exists
  changed_when: true
  no_log: true

- name: Verify CSR signature
  ansible.builtin.command:
    argv: [openssl, req, -in, "{{ pki_agent_csr_path }}", -verify, -noout]
  changed_when: false

- name: Inspect CSR identity
  ansible.builtin.command:
    argv: [openssl, req, -in, "{{ pki_agent_csr_path }}", -noout, -text]
  register: _pki_agent_csr_text
  changed_when: false

- name: Require expected environment-scoped identity and server name in CSR
  ansible.builtin.assert:
    that:
      - "('URI:' ~ pki_agent_identity) in _pki_agent_csr_text.stdout"
      - "('DNS:' ~ pki_agent_server_name) in _pki_agent_csr_text.stdout"
    fail_msg: >-
      Existing CSR does not contain both compiled names. A CSR left over from
      before the server name was added must be removed so it is regenerated
      against the unchanged node-local private key.

- name: Read public CSR for the CA adapter
  ansible.builtin.slurp:
    src: "{{ pki_agent_csr_path }}"
  register: _pki_agent_csr_public

# The CSR is public — proof of key possession and a declaration of names, never
# a secret. Handing it back as a file is what lets the coordinator sign it
# without an operator transcribing it out of a log.
#
# Written from the slurp above rather than fetched: the request lives in a
# 0700 root-owned directory, and the slurp has already crossed that boundary
# under become. delegate_to writes on the controller, so become must be off.
- name: Ensure the controller directory that collects CSRs
  ansible.builtin.file:
    path: "{{ pki_agent_csr_collect_directory }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  when: pki_agent_csr_collect_directory | length > 0

- name: Return the CSR to the controller for signing
  ansible.builtin.copy:
    content: "{{ _pki_agent_csr_public.content | b64decode }}"
    dest: "{{ pki_agent_csr_collect_directory }}/{{ spiritvpn_node_plan.instance.id }}.csr"
    mode: "0600"
  delegate_to: localhost
  become: false
  when:
    - pki_agent_csr_collect_directory | length > 0
    - pki_agent_certificate_chain | length == 0

# Fallback for a hand-run bootstrap that collects nothing: without it the CSR
# would exist only on the node and the operator would have no way to reach it.
- name: Report CSR readiness without exposing the private key
  ansible.builtin.debug:
    msg:
      status: CSR_READY
      instance_id: "{{ spiritvpn_node_plan.instance.id }}"
      certificate_identity: "{{ pki_agent_identity }}"
      tls_server_name: "{{ pki_agent_server_name }}"
      csr_pem: "{{ _pki_agent_csr_public.content | b64decode }}"
  when:
    - pki_agent_certificate_chain | length == 0
    - pki_agent_csr_collect_directory | length == 0

- name: Install returned certificate chain
  ansible.builtin.copy:
    content: "{{ pki_agent_certificate_chain }}"
    dest: "{{ pki_agent_certificate_path }}"
    owner: root
    group: root
    mode: "0644"
  when: pki_agent_certificate_chain | length > 0
  no_log: true
  diff: false

- name: Inspect installed certificate chain
  ansible.builtin.stat:
    path: "{{ pki_agent_certificate_path }}"
  register: _pki_agent_certificate

- name: Require a returned certificate chain when requested
  ansible.builtin.assert:
    that:
      - _pki_agent_certificate.stat.exists
    fail_msg: >-
      CSR is ready, but no certificate chain has been returned by the CA adapter.
      Resume bootstrap with pki_agent_certificate_chain after signing the reported CSR.
  when: pki_agent_require_certificate | bool

- name: Read installed certificate identity and validity
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ pki_agent_certificate_path }}", -noout, -text]
  register: _pki_agent_certificate_text
  changed_when: false
  when: _pki_agent_certificate.stat.exists

- name: Require correct identity in installed certificate
  ansible.builtin.assert:
    that:
      - "('URI:' ~ pki_agent_identity) in _pki_agent_certificate_text.stdout"
    fail_msg: "Installed machine certificate has the wrong identity."
  when: _pki_agent_certificate.stat.exists

# Exact check rather than a substring of -text, and the same one the backend's
# TLS stack performs on connect. control_runtime asserts the backend's own
# certificate this way for the same reason.
- name: Require the installed certificate to match its compiled TLS server name
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ pki_agent_certificate_path }}"
      - -noout
      - -checkhost
      - "{{ pki_agent_server_name }}"
  changed_when: false
  when: _pki_agent_certificate.stat.exists

- name: Require sufficient remaining certificate lifetime
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ pki_agent_certificate_path }}"
      - -noout
      - -checkend
      - "{{ pki_agent_minimum_validity_seconds | string }}"
  changed_when: false
  when: _pki_agent_certificate.stat.exists

- name: Install certificate renewal hook
  ansible.builtin.template:
    src: renew-agent-certificate.sh.j2
    dest: "{{ pki_agent_renewal_script_path }}"
    owner: root
    group: root
    mode: "0700"

- name: Install certificate renewal systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - "{{ pki_agent_renewal_service }}"
    - "{{ pki_agent_renewal_timer }}"
  register: _pki_agent_renewal_units

- name: Enable local certificate renewal timer
  ansible.builtin.systemd_service:
    name: "{{ pki_agent_renewal_timer }}"
    enabled: true
    state: started
    daemon_reload: "{{ _pki_agent_renewal_units.changed }}"
