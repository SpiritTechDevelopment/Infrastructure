#!/usr/sbin/nft -f
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    iifname "lo" accept
    ip protocol icmp limit rate 20/second accept
    ip6 nexthdr ipv6-icmp limit rate 20/second accept

    ip saddr 206.84.238.130/32 tcp dport 232 accept
    ip saddr 10.20.0.2/32 tcp dport 232 accept

    tcp dport { 443 } accept

    tcp dport { 10085 } accept

    iifname "wg0" ip saddr 10.20.0.1/32 tcp dport { 10085 } accept
    iifname "wg0" ip saddr 10.20.0.2/32 tcp dport { 10085 } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state invalid drop
    ct state established,related accept
    ip saddr 172.16.0.0/12 accept
  }

  chain output { type filter hook output priority filter; policy accept; }
}
