extends: default

# SOPS ciphertext is deliberately emitted as long scalar values. Its decrypted
# structure is validated by scripts/platform-sops.py instead.
ignore: |
  inventories/bootstrap/platform.sops.yml

rules:
  document-start: disable
  line-length:
    max: 180
    level: warning
  commas: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
