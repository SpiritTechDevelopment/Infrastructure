# Infrastructure v1 keeps the one-host platform bootstrap inputs in Git only as
# ciphertext. The age recipient is public; matching private identities belong
# to reviewed operators and recovery storage, never to this repository.
creation_rules:
  # Environment topology is sensitive infrastructure metadata, even though its
  # secret-bearing fields are only Vault references. Keep the structural
  # envelope visible and encrypt the complete desired-state payload.
  - path_regex: ^desired/environments/(develop|prod)/topology\.sops\.ya?ml$
    encrypted_regex: '^(spec)$'
    # Recovery keeps operator access; management decrypts during apply; the
    # dedicated self-hosted runner recipient is used by trusted CI and release
    # workflows without copying either of the other private identities.
    age: >-
      age1pkr5xnu5cynfq3lap0sqkh4euhgzcknhhfvpluj6tds38qmu6dlqxv84ax,
      age1gkflnrtnkwqza5p0zyjjd264x66kdxckf3dfnmcq6glhfekx5u5q9erfhc,
      age1r3tvuhn9g7csftpe9fxdfvpfw23aryhttcz2ft5hp4pg9jj8vvhq68fanx
  # Shared runtime defaults and the fleet ID registry affect every compiled
  # environment. Encrypt every scalar; the filenames and YAML keys remain
  # visible so public CI can enforce the repository layout without a key.
  - path_regex: ^desired/(common/(components|limits|networking|observability|rollout|xray)|fleet-ids)\.ya?ml$
    age: >-
      age1pkr5xnu5cynfq3lap0sqkh4euhgzcknhhfvpluj6tds38qmu6dlqxv84ax,
      age1gkflnrtnkwqza5p0zyjjd264x66kdxckf3dfnmcq6glhfekx5u5q9erfhc,
      age1r3tvuhn9g7csftpe9fxdfvpfw23aryhttcz2ft5hp4pg9jj8vvhq68fanx
  - path_regex: ^inventories/bootstrap/platform\.sops\.ya?ml$
    encrypted_regex: '^(inventory|known_hosts|vars)$'
    age: age1pkr5xnu5cynfq3lap0sqkh4euhgzcknhhfvpluj6tds38qmu6dlqxv84ax
