# SOPS config. Files matching path_regex are encrypted at rest; only the fields
# whose KEY matches encrypted_regex are turned to ciphertext (structure stays
# readable/diffable). Decryptable only by a listed `age` recipient — add each
# operator's + the deploy machine's age PUBLIC key here, then `sops updatekeys`.
#
# NOTE: encrypted_regex is a single-line regex on purpose — a folded (>-) scalar
# would fold newlines into spaces and silently break the alternation.
creation_rules:
  - path_regex: inventories/.*\.sops\.ya?ml$
    encrypted_regex: '^(ansible_host|address|.*uuid|id|reality_private_key|reality_public_key|reality_password|reality_short_ids|.*_secret|.*_token|.*_password|.*_private_key|xray_static_clients|entry_exits)$'
    age: age1pkr5xnu5cynfq3lap0sqkh4euhgzcknhhfvpluj6tds38qmu6dlqxv84ax
