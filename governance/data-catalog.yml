tenants:
  ops:
    retention: 30d
    fields:
      - {name: xray_access_log, purpose: "connection debugging and E2E verification", pii: medium}
      - {name: xray_error_log, purpose: "VPN health and handshake failures", pii: low}
      - {name: nginx_access_error_log, purpose: "mask endpoint operation", pii: medium}
      - {name: container_log, purpose: "service lifecycle and incident diagnosis", pii: low}
      - {name: metrics, purpose: "capacity, saturation and availability", pii: none}
  activity:
    retention: 0d
    enabled: false
    fields: []
per_user_usage:
  source: xray_statsservice
  fields: [pseudonymous_accounting_id, uplink_bytes, downlink_bytes]
  purpose: "quota enforcement, support and billing"
  retention: "per backend billing policy"
  # Operational visibility only (top-talkers dashboard): the xray-usage-exporter
  # re-exposes these counters as Prometheus metrics keyed by the pseudonymous
  # accounting id, at Prometheus's tsdb retention. This is NOT the authoritative
  # billing store — durable per-user accounting remains the backend's, per the
  # retention line above. Cardinality is bounded by usage_exporter_top_n.
  operational_exposure:
    sink: prometheus_metrics
    fields: [pseudonymous_accounting_id, uplink_bytes, downlink_bytes]
    pii: low
    retention: prometheus_tsdb
