  # Docker Hub и quay.io недоступны из сети, где стоит entry-1: соединение не
  # отвергается, а виснет до таймаута. Три образа ниже объявлены через
  # pull-through зеркало Google, иначе вход не вытянет три компонента из
  # четырёх. Адресация по содержимому, поэтому digest'ы для nginx и alloy те же
  # самые, что на Docker Hub, и подмены слоёв зеркало допустить не может.
  #
  # node_exporter — единственный, кто сменил источник: он был объявлен на quay,
  # а зеркало отдаёт копию из Docker Hub (prom/node-exporter). Это отдельный
  # пуш того же релиза, поэтому и digest здесь другой, не quay'ный.
