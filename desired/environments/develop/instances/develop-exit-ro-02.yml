apiVersion: spiritvpn.io/v1alpha1
kind: Instance
metadata:
  id: develop-exit-ro-02
spec:
  logical_node: develop-exit-ro
  target_state: serving
  public_address: 185.167.62.9
  # RSA, а не ed25519: у этой машины в known_hosts исполнителя был только
  # RSA-ключ, и объявить надо то, что есть, а не то, что хотелось бы. Нода
  # собрана руками отдельно от остальных — отсюда и расхождение с entry.
  # Имя типа называет ключ, а не подпись: клиент договорится на rsa-sha2-*.
  # Выравнивание флота на ed25519 — отдельная осознанная работа.
  #
  # Ключ обязан быть одной строкой: свёрнутый скаляр YAML склеивает переносы
  # пробелом, а пробел внутри base64 делает ключ другим ключом.
  # yamllint disable-line rule:line-length
  ssh_host_key: ssh-rsa 
  bandwidth_profile: vps-1g
  provider:
    name: manual
    resource_id: exit-ro
