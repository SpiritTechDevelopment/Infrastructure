# Complete one-entry/one-exit example for `make deploy-e2e INVENTORY=examples/inventory.yml`.
# Replace every REPLACE_* value. No SSH/firewall/fail2ban/WireGuard hardening is
# enabled. The Xray gRPC API is intentionally public on TCP/10085 for the current no-hardening phase.
all:
  vars:
    ansible_user: root


    common_manage_deploy_user: false
    common_remove_legacy_sshd_dropin: false
    common_manage_sshd: false
    common_manage_firewall: false
    common_enable_fail2ban: false
    common_manage_sysctl: false
    common_enable_auditd: false
    common_enable_unattended_upgrades: false
    docker_manage_daemon_config: false
    docker_remove_legacy_no_new_privileges: false
    management_wireguard_enabled: false

    control_plane_host: "REPLACE_PLATFORM_PUBLIC_IP"
    platform_bind_address: "0.0.0.0"
    vault_bind_address: "127.0.0.1"
    vault_tls_enabled: false

    xray_enable_api: true
    xray_api_public_mode: true
    xray_api_bind: "0.0.0.0"
    xray_api_port: 10085
    xray_api_services: [HandlerService, StatsService, ReflectionService]
    xray_access_log: ""
    xray_error_log: ""
    xray_loglevel: info
    xray_metrics_enabled: true
    xray_metrics_bind: "127.0.0.1"
    xray_metrics_port: 11111
    mask_bind_address: "127.0.0.1"
    mask_port: 8443
    node_exporter_bind_address: "127.0.0.1"
    node_exporter_port: 9100

    loki_ops_endpoint: "http://{{ control_plane_host }}:3100/loki/api/v1/push"
    prometheus_remote_write: "http://{{ control_plane_host }}:9090/api/v1/write"

  children:
    platform:
      hosts:
        control-1:
          ansible_host: "REPLACE_PLATFORM_PUBLIC_IP"
          grafana_admin_password: "REPLACE_WITH_AT_LEAST_20_RANDOM_CHARACTERS"
          alertmanager_webhook_url: ""

    exit:
      vars:
        node_role: exit
        xray_domain_strategy: IPIfNonMatch
        xray_dns_servers: [1.1.1.1, 8.8.8.8]
        xray_sniffing_route_only: false
      hosts:
        exit-fr:
          ansible_host: "REPLACE_EXIT_PUBLIC_IP"
          public_hostname: "exit-fr.example.com"
          public_port: 443
          xray_api_public_host: "REPLACE_EXIT_PUBLIC_IP"
          expected_egress_ip: "REPLACE_EXIT_PUBLIC_IP"
          country: fr
          reality_server_names: ["exit-fr.example.com"]
          reality_short_ids: ["0123456789abcdef"]
          reality_private_key: ""
          entry_service_uuid: "11111111-1111-4111-8111-111111111111"
          xray_static_clients:
            - id: "11111111-1111-4111-8111-111111111111"
              email: "svc-entry-fr"
          mask_tls_certificate: |
            -----BEGIN CERTIFICATE-----
            REPLACE_WITH_MASK_CERTIFICATE
            -----END CERTIFICATE-----
          mask_tls_private_key: |
            -----BEGIN PRIVATE KEY-----
            REPLACE_WITH_MASK_PRIVATE_KEY
            -----END PRIVATE KEY-----

    entry:
      vars:
        node_role: entry
        entry_exits: []
        entry_default_exit_tag: fr-exit
        xray_static_clients: []
        xray_domain_strategy: AsIs
        xray_sniffing_route_only: true
        xray_entry_block_unmatched: false
      hosts:
        entry-1:
          ansible_host: "REPLACE_ENTRY_PUBLIC_IP"
          public_hostname: "entry.example.com"
          public_port: 443
          xray_api_public_host: "REPLACE_ENTRY_PUBLIC_IP"
          reality_server_names: ["entry.example.com"]
          reality_short_ids: ["fedcba9876543210"]
          reality_private_key: ""
          mask_tls_certificate: |
            -----BEGIN CERTIFICATE-----
            REPLACE_WITH_MASK_CERTIFICATE
            -----END CERTIFICATE-----
          mask_tls_private_key: |
            -----BEGIN PRIVATE KEY-----
            REPLACE_WITH_MASK_PRIVATE_KEY
            -----END PRIVATE KEY-----
