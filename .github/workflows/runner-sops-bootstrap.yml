name: runner-sops-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-sops-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, spiritvpn-deploy]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Create the runner-local SOPS identity
        shell: bash
        run: scripts/bootstrap-runner-sops.sh | tee -a "$GITHUB_STEP_SUMMARY"
