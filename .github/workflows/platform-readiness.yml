name: platform-readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose management foundation is checked
        required: true
        type: choice
        options: [develop, staging, prod]

permissions:
  contents: read

concurrency:
  group: platform-readiness-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install fleetctl and Ansible parser
        run: python -m pip install . 'ansible-core>=2.18,<2.19'
      - name: Render and validate platform input
        run: make fleet-platform-check ENVIRONMENT="${{ inputs.environment }}"
      - name: Install the environment-protected SSH identity and pinned host key
        shell: bash
        env:
          PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.PLATFORM_SSH_PRIVATE_KEY }}
          PLATFORM_SSH_KNOWN_HOSTS: ${{ secrets.PLATFORM_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PLATFORM_SSH_PRIVATE_KEY"
          test -n "$PLATFORM_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PLATFORM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/platform-ssh-key"
          printf '%s\n' "$PLATFORM_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          python -m fleetctl.cli platform-known-hosts-check \
            --build-dir "build/platform/${{ inputs.environment }}" \
            --known-hosts "$HOME/.ssh/known_hosts"
      - name: Run read-only platform readiness over SSH
        env:
          ANSIBLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/platform-ssh-key
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: >-
          ansible-playbook
          -i "build/platform/${{ inputs.environment }}/platform-inventory.json"
          playbooks/platform/runtime-readiness.yml
