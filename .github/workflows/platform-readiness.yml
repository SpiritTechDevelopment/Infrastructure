name: platform-readiness

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose management foundation is checked
        required: true
        type: choice
        options: [develop, staging, prod]

permissions:
  contents: read

concurrency:
  group: platform-readiness-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install the environment-protected SSH identity
        shell: bash
        env:
          PLATFORM_SSH_PRIVATE_KEY: ${{ secrets.PLATFORM_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PLATFORM_SSH_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$PLATFORM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/platform-ssh-key"
      - name: Validate tracked public SSH trust input
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.PLATFORM_SSH_HOST }}"
          grep -Ev '^[[:space:]]*(#|$)' inventories/bootstrap/known_hosts >/dev/null
      - name: Invoke the restricted read-only command
        env:
          PLATFORM_SSH_PRIVATE_KEY_FILE: ${{ runner.temp }}/platform-ssh-key
          PLATFORM_SSH_KNOWN_HOSTS_FILE: inventories/bootstrap/known_hosts
        run: scripts/platform-remote.sh "${{ vars.PLATFORM_SSH_HOST }}" platform-readiness
