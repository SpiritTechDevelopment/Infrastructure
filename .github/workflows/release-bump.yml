name: release-bump

# Репозитории бэкенда и агента сообщают сюда digest опубликованного образа.
on:
  repository_dispatch:
    types: [control-release, agent-release, bot-release]

permissions:
  contents: read

concurrency:
  group: release-bump-${{ github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: [self-hosted, linux, spiritvpn-deploy]
    env:
      COMPONENT: ${{ github.event.action }}
      ENVIRONMENT: ${{ github.event.client_payload.environment }}
      SOURCE_GIT_SHA: ${{ github.event.client_payload.source_git_sha }}
      BACKEND_REPOSITORY: ${{ github.event.client_payload.backend.repository }}
      BACKEND_DIGEST: ${{ github.event.client_payload.backend.digest }}
      MIGRATION_REPOSITORY: ${{ github.event.client_payload.migration.repository }}
      MIGRATION_DIGEST: ${{ github.event.client_payload.migration.digest }}
      AGENT_REPOSITORY: ${{ github.event.client_payload.image.repository }}
      AGENT_DIGEST: ${{ github.event.client_payload.image.digest }}
      BOT_REPOSITORY: ${{ github.event.client_payload.image.repository }}
      BOT_DIGEST: ${{ github.event.client_payload.image.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INFRA_PUSH_TOKEN }}

      - name: Validate the payload
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" =~ ^(develop|prod)$ ]]
          [[ "$SOURCE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          check_image() {
            local repository=$1 digest=$2
            [[ "$repository" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          }

          case "$COMPONENT" in
            control-release)
              check_image "$BACKEND_REPOSITORY" "$BACKEND_DIGEST"
              check_image "$MIGRATION_REPOSITORY" "$MIGRATION_DIGEST"
              ;;
            agent-release)
              check_image "$AGENT_REPOSITORY" "$AGENT_DIGEST"
              ;;
            bot-release)
              check_image "$BOT_REPOSITORY" "$BOT_DIGEST"
              ;;
            *)
              echo "неизвестный компонент: $COMPONENT" >&2
              exit 1
              ;;
          esac

      - name: Bind the runner-local SOPS identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = github-runner
          bin="$HOME/.local/spiritvpn/bin"
          identity="$HOME/.config/spiritvpn/sops/age-identity.txt"
          test "$(stat -c '%a:%U' "$identity")" = 600:github-runner
          test -x "$bin/sops"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          printf 'SOPS_AGE_KEY_FILE=%s\n' "$identity" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install fleetctl
        run: python -m pip install .

      - name: Apply the release to desired state
        run: |
          set -euo pipefail
          file="desired/environments/${ENVIRONMENT}/topology.sops.yml"
          candidate="$RUNNER_TEMP/${ENVIRONMENT}.topology.sops.yml"
          case "$COMPONENT" in
            control-release)
              repository="$BACKEND_REPOSITORY"
              digest="$BACKEND_DIGEST"
              secondary_repository="$MIGRATION_REPOSITORY"
              secondary_digest="$MIGRATION_DIGEST"
              ;;
            agent-release)
              repository="$AGENT_REPOSITORY"
              digest="$AGENT_DIGEST"
              secondary_repository=-
              secondary_digest=-
              ;;
            bot-release)
              repository="$BOT_REPOSITORY"
              digest="$BOT_DIGEST"
              secondary_repository=-
              secondary_digest=-
              ;;
          esac
          python scripts/topology-release.py bump \
            --root "$PWD" \
            --environment "$ENVIRONMENT" \
            --component "$COMPONENT" \
            --release-source-git-sha "$SOURCE_GIT_SHA" \
            --repository "$repository" \
            --digest "$digest" \
            --secondary-repository "$secondary_repository" \
            --secondary-digest "$secondary_digest" > "$candidate"
          test -s "$candidate"
          cp "$candidate" "$file"

      - name: Refuse an unexpected change
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "desired/environments/${ENVIRONMENT}/topology.sops.yml"

      - name: Validate desired state
        run: |
          set -euo pipefail
          python -m fleetctl.cli validate --environment "$ENVIRONMENT"

      - name: Land the release
        env:
          GH_TOKEN: ${{ secrets.INFRA_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'spiritvpn-release'
          git config user.email 'release@spiritvpn.invalid'
          short="${SOURCE_GIT_SHA:0:12}"
          message="chore(${ENVIRONMENT}): ${COMPONENT} ${short}"

          if [ "$ENVIRONMENT" = develop ]; then
            git commit -am "$message"
            git push origin HEAD:main
          else
            branch="release/${COMPONENT}-${ENVIRONMENT}-${short}"
            git checkout -b "$branch"
            git commit -am "$message"
            git push --force-with-lease origin "$branch"
            body="Образ опубликован и закреплён по digest."
            body+=" Слияние переносит версию в среду ${ENVIRONMENT};"
            body+=" успешный CI точного коммита main запускает desired-state-deploy."
            gh pr create --base main --head "$branch" --title "$message" \
              --body "$body"
          fi
