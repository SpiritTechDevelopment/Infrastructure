name: release-bump

# Репозитории бэкенда и агента сообщают сюда digest опубликованного образа.
# Это уведомление о факте, а не команда на выкатку: что из него следует, решает
# инфраструктура.
#
# Digest всегда доезжает до среды коммитом. Если бы версия ехала параметром
# workflow, Git перестал бы описывать работающую систему: impact plan считался
# бы против устаревшей базы, а следующий рутинный прогон вернул бы старую
# версию из desired state и молча откатил среду.
#
# Этот workflow только доводит изменение до main. Выкатку запускает
# desired-state-deploy по факту появления коммита — потому что источником истины
# является main, а не то, что здесь посчитали. Благодаря этому ручная правка
# digest'а оператором раскатывается тем же путём, что и автоматическая.
on:
  repository_dispatch:
    types: [control-release, agent-release]

# Пишет в репозиторий отдельный токен, а не GITHUB_TOKEN: слияние, выполненное
# от GITHUB_TOKEN, не порождает событий, и выкатка после него не запустилась бы.
permissions:
  contents: read

# Два предложения для одной среды одновременно не нужны; develop и prod друг
# друга не блокируют.
concurrency:
  group: release-bump-${{ github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      COMPONENT: ${{ github.event.action }}
      ENVIRONMENT: ${{ github.event.client_payload.environment }}
      SOURCE_GIT_SHA: ${{ github.event.client_payload.source_git_sha }}
      BACKEND_REPOSITORY: ${{ github.event.client_payload.backend.repository }}
      BACKEND_DIGEST: ${{ github.event.client_payload.backend.digest }}
      MIGRATION_REPOSITORY: ${{ github.event.client_payload.migration.repository }}
      MIGRATION_DIGEST: ${{ github.event.client_payload.migration.digest }}
      AGENT_REPOSITORY: ${{ github.event.client_payload.image.repository }}
      AGENT_DIGEST: ${{ github.event.client_payload.image.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.INFRA_PUSH_TOKEN }}

      # Полезная нагрузка пришла из другого репозитория по сети и доверенной не
      # является. Проверяется форма каждого поля целиком: без якоря `$` строка
      # `develop; rm -rf /` прошла бы проверку «начинается с develop».
      - name: Validate the payload
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" =~ ^(develop|prod)$ ]]
          [[ "$SOURCE_GIT_SHA" =~ ^[0-9a-f]{40}$ ]]

          check_image() {
            local repository=$1 digest=$2
            [[ "$repository" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          }

          case "$COMPONENT" in
            control-release)
              check_image "$BACKEND_REPOSITORY" "$BACKEND_DIGEST"
              check_image "$MIGRATION_REPOSITORY" "$MIGRATION_DIGEST"
              ;;
            agent-release)
              check_image "$AGENT_REPOSITORY" "$AGENT_DIGEST"
              ;;
            *)
              echo "неизвестный компонент: $COMPONENT" >&2
              exit 1
              ;;
          esac

      # Секция control обязана существовать заранее. Создавать её здесь нельзя:
      # получился бы control без postgres, secrets и authorization, то есть
      # коммит, заведомо не проходящий валидацию схемы.
      - name: Require an existing control release
        if: github.event.action == 'control-release'
        run: |
          set -euo pipefail
          yq -e '.spec.control.backend_release' \
            "desired/environments/${ENVIRONMENT}/environment.yml" >/dev/null

      # Оверлей компонента, в отличие от control, самодостаточен: repository и
      # digest — это всё, что нужно поверх desired/common/components.yml.
      # Поэтому его допустимо создать, если его ещё нет.
      - name: Apply the release to desired state
        run: |
          set -euo pipefail
          file="desired/environments/${ENVIRONMENT}/environment.yml"
          case "$COMPONENT" in
            control-release)
              yq -i '
                .spec.control.backend_release.source_git_sha = strenv(SOURCE_GIT_SHA) |
                .spec.control.backend_release.backend_image.repository = strenv(BACKEND_REPOSITORY) |
                .spec.control.backend_release.backend_image.digest = strenv(BACKEND_DIGEST) |
                .spec.control.backend_release.migration_image.repository = strenv(MIGRATION_REPOSITORY) |
                .spec.control.backend_release.migration_image.digest = strenv(MIGRATION_DIGEST)
              ' "$file"
              ;;
            agent-release)
              yq -i '
                .spec.common_overrides.components.node_agent.repository = strenv(AGENT_REPOSITORY) |
                .spec.common_overrides.components.node_agent.digest = strenv(AGENT_DIGEST)
              ' "$file"
              ;;
          esac

      # Автоматическая правка обязана быть узкой. Любой лишний файл означает
      # ошибку в выражении yq, а не изменение релиза.
      - name: Refuse an unexpected change
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "desired/environments/${ENVIRONMENT}/environment.yml"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Локальная проверка до открытия pull request: сломанное предложение не
      # должно доходить до ревьюера и занимать очередь проверок.
      - name: Validate desired state
        run: |
          set -euo pipefail
          python -m pip install .
          python -m fleetctl.cli validate --environment "$ENVIRONMENT"

      # develop едет в main сразу — коммит здесь нужен машине, а не ревьюеру.
      # prod останавливается на pull request: продвижение версии в прод есть
      # решение человека, а не следствие успешной сборки. Слить его нужно
      # вручную; выкатку запустит уже само появление коммита в main.
      - name: Land the release
        env:
          GH_TOKEN: ${{ secrets.INFRA_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'spiritvpn-release'
          git config user.email 'release@spiritvpn.invalid'
          short="${SOURCE_GIT_SHA:0:12}"
          message="chore(${ENVIRONMENT}): ${COMPONENT} ${short}"

          if [ "$ENVIRONMENT" = develop ]; then
            git commit -am "$message"
            git push origin HEAD:main
          else
            branch="release/${COMPONENT}-${ENVIRONMENT}-${short}"
            git checkout -b "$branch"
            git commit -am "$message"
            git push --force-with-lease origin "$branch"
            gh pr create --base main --head "$branch" --title "$message" \
              --body "Образ опубликован и закреплён по digest. Слияние переносит версию в среду ${ENVIRONMENT}; выкатку запустит desired-state-deploy по появлению коммита в main."
          fi
