name: ci

# Static validation only: desired state, compiler tests, deterministic render,
# generated inventory parsing, and active v1 Ansible lint/syntax checks.
# Runs on the GitHub-hosted runner — it needs NO secrets and NO fleet access
# and is safe to run on every PR, including from forks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desired-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install fleetctl and inventory parser
        run: python -m pip install . 'ansible-core>=2.18,<2.19'
      - name: Validate desired state
        run: make fleet-validate
      - name: Run fleetctl tests
        run: make fleet-test
      - name: Verify deterministic render and Ansible inventory
        env:
          FIRST_RENDER: ${{ runner.temp }}/fleetctl-render-first
          SECOND_RENDER: ${{ runner.temp }}/fleetctl-render-second
        run: |
          for environment in develop prod; do
            python -m fleetctl.cli render --environment "$environment" --output "$FIRST_RENDER/$environment"
            python -m fleetctl.cli render --environment "$environment" --output "$SECOND_RENDER/$environment"
            diff -ru "$FIRST_RENDER/$environment" "$SECOND_RENDER/$environment"
            ansible-inventory -i "$FIRST_RENDER/$environment/ansible-inventory.json" --list >/dev/null
            python -m fleetctl.cli plan \
              --environment "$environment" \
              --baseline desired \
              --output "$FIRST_RENDER/$environment"
            python -m json.tool "$FIRST_RENDER/$environment/impact-plan.json" >/dev/null
          done

      # The repository environments carry no fleet, so the step above proves
      # the frame and not the paths that handle real topology. The fixture is
      # the only desired state with nodes, instances and a control plane in it,
      # and `--root` is enough to compile it without a flag that could later be
      # pointed at an unreviewed directory for real.
      - name: Compile the populated fixture desired state
        env:
          FIXTURE_ROOT: ${{ runner.temp }}/fleetctl-fixture
        run: |
          set -euo pipefail
          mkdir -p "$FIXTURE_ROOT"
          cp -r tests/fixtures/valid/desired "$FIXTURE_ROOT/desired"
          cp -r contracts "$FIXTURE_ROOT/contracts"
          python -m fleetctl.cli --root "$FIXTURE_ROOT" validate --environment develop
          python -m fleetctl.cli --root "$FIXTURE_ROOT" render \
            --environment develop --output "$FIXTURE_ROOT/first"
          python -m fleetctl.cli --root "$FIXTURE_ROOT" render \
            --environment develop --output "$FIXTURE_ROOT/second"
          diff -ru "$FIXTURE_ROOT/first" "$FIXTURE_ROOT/second"
          ansible-inventory -i "$FIXTURE_ROOT/first/ansible-inventory.json" --list >/dev/null
          test -s "$FIXTURE_ROOT/first/control-plan.json"
          # An empty target list still renders and still parses. Monitoring
          # that collects nothing must fail the build, not pass it quietly.
          python - "$FIXTURE_ROOT/first/monitoring-targets.json" <<'PYTHON'
          import json, sys

          targets = json.load(open(sys.argv[1]))["targets"]
          scraped = [
              target
              for target in targets
              if target["kind"] == "metrics" and target["collection"] == "management"
          ]
          services = {target["service"] for target in scraped}
          assert services == {"node-exporter", "agent-metrics", "backend-metrics"}, services
          print(f"fixture: {len(targets)} targets, {len(scraped)} scraped")
          PYTHON

  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tags are mutable). Update the SHA and the
      # trailing version comment together when bumping.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install -r requirements-ansible.txt
      - name: Static checks
        run: make check
      - name: Lint
        run: make lint
