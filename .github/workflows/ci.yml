name: ci

# Static validation only: lint, syntax, template render, dashboard checks.
# Runs on the GitHub-hosted runner — it needs NO secrets and NO fleet access
# (make check / make lint operate entirely on the repo + the static fixture
# inventory). Safe to run on every PR, including from forks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tags are mutable). Update the SHA and the
      # trailing version comment together when bumping. See OPERATIONS.md.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          pip install 'ansible-core>=2.18,<2.19' ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml
      - name: Static checks (render/syntax/dashboards)
        run: make check STATIC_INVENTORY=examples/static-check-inventory.yml
      - name: Lint
        run: make lint STATIC_INVENTORY=examples/static-check-inventory.yml
