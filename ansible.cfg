[defaults]
roles_path = roles
# No default inventory: fleet v1 commands must pass generated inventory with
# -i; platform bootstrap passes its one reviewed manual inventory explicitly.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent

[inventory]
enable_plugins = ansible.builtin.auto, ansible.builtin.yaml, ansible.builtin.ini
unparsed_is_failed = True

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
