[defaults]
roles_path = roles
# No default inventory: fleet v1 commands must pass generated inventory with
# -i; platform bootstrap passes its one reviewed manual inventory explicitly.
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# Ноды стоят там, где им нужно стоять, а не там, где к ним хороший канал, и
# управляющий трафик идёт по тому же аплинку, что пользовательский. Десяти
# секунд по умолчанию хватает ровно до первого нагруженного узла: на entry-ru
# задачи, занимающие на exit-ro 2-5 секунд, шли по 24-31, после чего выкатка
# падала с unreachable на живой и исправной ноде.
timeout = 30

[inventory]
enable_plugins = ansible.builtin.host_list, ansible.builtin.auto, ansible.builtin.yaml, ansible.builtin.ini
unparsed_is_failed = True

[privilege_escalation]
become = False
become_method = sudo

[ssh_connection]
pipelining = True
# Потеря пакета на пути к ноде не должна означать провал всей выкатки: она
# означает ровно потерю пакета.
retries = 3
# ControlPersist держит один TCP-сеанс на всю роль, поэтому на плохом канале
# цена рукопожатия платится один раз, а не на каждой задаче. Шестидесяти секунд
# не хватало: задачи на нагруженной ноде занимают полминуты, и мультиплексор
# истекал между ними. ServerAlive не даёт признать сеанс мёртвым из-за паузы,
# пока на той стороне идёт apt.
ssh_args = -o ControlMaster=auto -o ControlPersist=180s -o ServerAliveInterval=15 -o ServerAliveCountMax=6
