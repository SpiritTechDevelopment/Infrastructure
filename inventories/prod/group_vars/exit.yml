---
node_role: exit
xray_domain_strategy: IPIfNonMatch
xray_dns_servers:
  - 1.1.1.1
  - 8.8.8.8
xray_block_domains:
  - geosite:category-ads-all
xray_sniffing_route_only: false

# The entry authenticates to this exit with an infrastructure-owned identity.
# Customer users can also be added directly to an exit through HandlerService.
xray_static_clients:
  - id: "{{ entry_service_uuid }}"
    email: "svc-entry-{{ country }}"
