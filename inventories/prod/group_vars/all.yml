---
env: prod

# Steady-state deploys authenticate as the named `deploy` user and escalate via
# sudo (NOPASSWD), instead of logging in as root. Remote plays set `become: true`;
# localhost plays set `become: false` (this global default is overridden there).
# Root remains key-only break-glass. See OPERATIONS.md.
ansible_user: deploy
ansible_become: true
xray_image: ghcr.io/xtls/xray-core:26.3.27
nginx_mask_image: nginx:1.29-alpine
alloy_image: grafana/alloy:v1.17.1
node_exporter_image: quay.io/prometheus/node-exporter:v1.9.1
vault_disable_mlock: true

# Functional no-hardening mode: deploy a complete usable service without changing host
# SSH policy, host firewall, fail2ban, sysctl security policy, or WireGuard.
common_manage_deploy_user: false
common_remove_legacy_sshd_dropin: false
common_manage_sshd: false
common_manage_firewall: false
common_enable_fail2ban: false
common_manage_sysctl: false
common_enable_auditd: false
common_enable_unattended_upgrades: false
docker_manage_daemon_config: false
docker_remove_legacy_no_new_privileges: false
management_wireguard_enabled: false

# Backend-facing Xray API. During this functional phase it is intentionally public
# and unauthenticated so the backend and E2E controller can use it immediately.
# Do not expose this mode on an untrusted production network indefinitely.
xray_enable_api: true
xray_api_public_mode: true
xray_api_bind: "0.0.0.0"
xray_api_port: 10085
xray_api_services:
  - HandlerService
  - StatsService
  - ReflectionService

# Emit both access and error logs to container stdout/stderr. Alloy discovers the
# vpn Compose project and ships these logs to Loki.
xray_access_log: ""
xray_error_log: ""
xray_loglevel: info
xray_mask_address: ""
xray_stats_user_traffic: true
xray_listen_port: 443
xray_metrics_enabled: true
xray_metrics_bind: "127.0.0.1"
xray_metrics_port: 11111
mask_bind_address: "127.0.0.1"
mask_port: 8443
node_exporter_bind_address: "127.0.0.1"
node_exporter_port: 9100

# Telemetry pushes over the WireGuard overlay to the hub (10.20.0.1), not the
# public IP — part of the overlay-first exposure model. Depends on wg0 being up
# on every node (entry-1 10.20.0.11, exit-fr 10.20.0.21).
telemetry_hub_host: "10.20.0.1"
loki_ops_endpoint: "http://{{ telemetry_hub_host }}:3100/loki/api/v1/push"
prometheus_remote_write: "http://{{ telemetry_hub_host }}:9090/api/v1/write"

# Node lifecycle. Disabled hosts stay declared but are excluded from deployment,
# wiring, verification, and observability target generation.
node_enabled: true

# --- Operators (public-key roster) --------------------------------------------
# One block per operator = ALL their public keys in one place. Public keys are
# safe to commit/review in a PR. Consumed by:
#   - playbooks/access.yml -> root authorized_keys (uses ssh_key). EXCLUSIVE
#     management, so this roster must be COMPLETE or you lock people out (SSH is
#     key-only fleet-wide). Always `--check --diff` before applying.
#   - management_wireguard role (uses wg_pubkey/wg_ip; role still stubbed).
#   - .sops.yaml: age_recipient must ALSO be listed there — sops reads .sops.yaml,
#     not Ansible vars. Keep the two in sync when adding/removing an operator.
operators:
  - name: pavel
    ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIArouBDJ+F+13H5T0ZgxEhSr9H3zFhrsymJdtBvt/aj5 xvpaul@github.com"
    wg_pubkey: "ooq8pY1/+HxkA+lNCaZivEbhqDR1K55FeAOPr4eTfyQ="
    wg_ip: "10.20.0.2"
    age_recipient: "age1pkr5xnu5cynfq3lap0sqkh4euhgzcknhhfvpluj6tds38qmu6dlqxv84ax"
  - name: roman
    ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGrWDKriCu9TfHIRz8NBLI88AluJD0tNA2aFSBcghIC4 romanrabinkin@lenza"
    wg_pubkey: ""       # TBD — Roman generates a WireGuard key
    wg_ip: ""           # TBD — assign a free 10.20.0.x
    age_recipient: ""   # TBD — add to .sops.yaml too when set

# Overlay peers derived from the roster (operators who have a wg_ip assigned). The
# management_wireguard role (when un-stubbed) reads .name / .wg_pubkey / .wg_ip.
management_wireguard_external_peers: "{{ operators | selectattr('wg_ip', 'truthy') | list }}"
