---
node_role: entry
entry_exits: []
xray_static_clients: []
xray_domain_strategy: AsIs
xray_sniffing_route_only: true

# Every ordinary backend-created user on the entry uses this default exit. Special
# per-exit selector identities (via-<country>) remain available only for operator
# smoke tests. This makes a normal unique backend user work immediately.
# 2026-08-09: switched fr-exit -> nl-exit after exit-fr went down. Every ordinary
# user follows this tag, so the migration needs no client-side change (links point
# at entry-1, not at an exit). fleet-infra.yml asserts this tag exists in
# entry_exits, so `make wire` must run BEFORE this value changes.
entry_default_exit_tag: nl-exit
xray_entry_block_unmatched: false

# Self-heal runtime users after an Xray restart (add-only; no-op without a
# backend-written snapshot at xray_reconcile_snapshot). Legacy contour only.
xray_auto_reconcile_enabled: true
# Enable after backend_internal_api_token is added to SOPS deploy secrets.
xray_desired_users_sync_enabled: false
xray_desired_users_url: "http://10.20.0.1:18080/internal/v1/vpn/desired-users"
