---
# nftables firewall profile for exit-ru (VPN exit / direct-connect, Russia).
# Inert until deploy_mode != runtime AND common_manage_firewall=true (both remain
# off in the functional phase). Mirrors exit-fr: the node is HOST-NETWORKED for the
# data plane (vpn-xray-1 binds host *:443 and *:10085 directly), so 443/10085 are
# INPUT-chain ports needing no forward-chain DNAT rules.
#
# EFFECTIVE ACCESS after apply:
#   - SSH (:232) open to anyone with a valid key (key-only auth enforced fleet-wide).
#     Empty ssh_allowed_cidrs renders `tcp dport 232 accept` (IPv4 + IPv6).
#   - 443 (VLESS/REALITY) public  ← direct-connect data plane (client -> exit-ru:443)
#   - 10085 (Xray API) overlay-only (10.20.0.0/24 over wg0)
#   - Docker-bridge egress preserved (harmless; data plane is host-networked)
ssh_allowed_cidrs: []   # [] = SSH from anywhere; security is key-only auth
common_public_tcp_ports: [443]
common_restricted_tcp_rules:
  - { ports: [10085], cidrs: ['10.20.0.0/24'], interface: wg0 }
common_docker_bridge_forwarding: true
