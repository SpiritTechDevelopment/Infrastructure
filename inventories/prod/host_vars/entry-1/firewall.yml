---
# nftables firewall profile for entry-1. Inert until deploy_mode != runtime AND
# common_manage_firewall=true. EFFECTIVE access:
#   - SSH (port 232, from ansible_port) open to anyone with a valid key (no
#     source whitelist; key-only auth is enforced fleet-wide)
#   - public 443 (VLESS/REALITY); 10085 (Xray API) is overlay-only
#   - Docker-bridge forward egress (harmless no-op here; entry-1 is host-networked)
# ssh_port derives from ansible_port (232). Empty ssh_allowed_cidrs renders
# `tcp dport 232 accept` (both IPv4 and IPv6 in this inet table).
ssh_allowed_cidrs: []   # [] = SSH from anywhere; security is key-only auth
# Only 443 (VLESS/REALITY) is public now. The Xray API (10085) is overlay-only:
# reachable from the management network (10.20.0.0/24 over wg0) — the hub/exporter,
# verify, and the operator workstation all reach it privately.
common_public_tcp_ports: [443]
common_restricted_tcp_rules:
  - { ports: [10085], cidrs: ['10.20.0.0/24'], interface: wg0 }
common_docker_bridge_forwarding: true
