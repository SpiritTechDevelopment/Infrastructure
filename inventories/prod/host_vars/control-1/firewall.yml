---
# nftables firewall profile for control-1 (platform: Vault + observability).
# Inert until deploy_mode != runtime AND common_manage_firewall=true.
#
# control-1 is a Docker BRIDGE + DNAT host: the platform containers
# (Grafana 3000, Loki 3100, Prometheus 9090, Alertmanager 9093, Vault 8200/8201)
# publish ports, so with userland-proxy=false inbound traffic is DNATed in
# ip nat/PREROUTING and then traverses the FORWARD chain (not input). The managed
# template emits, for every common_restricted_tcp_rules entry, BOTH an input-chain
# rule (host-bound) and a forward-chain `ct status dnat` rule (published-port) —
# which is exactly what a bridge/DNAT host needs. The add+delete idiom replaces
# only `inet filter`, leaving Docker's `ip nat` table intact (no docker restart).
#
# GOAL of this profile (C2): remove the public stopgap openings of 3000/3100/9090
# and make all platform ports OVERLAY-ONLY, while codifying the firewall.
#
# EFFECTIVE ACCESS after apply (compare to captured-state/control-1/etc-nftables.conf):
#   - SSH (:22) open to anyone with a valid key (no source whitelist; key-only
#     auth is enforced fleet-wide). Empty ssh_allowed_cidrs -> `tcp dport 22
#     accept` (matches both IPv4 and IPv6 in this inet table).
#   - WG (udp 51820) public (overlay transport must stay reachable)
#   - NOTHING else public  ← the public `tcp dport {3000,3100,9090}` rule is dropped
#   - Loki 3100 + Prometheus 9090 reachable from the whole overlay 10.20.0.0/24
#     over wg0 (nodes remote-write to 10.20.0.1:9090 and push logs to :3100)
#   - Grafana 3000 + Vault 8200 + Alertmanager 9093 reachable from the operator
#     workstation 10.20.0.2 over wg0 (8200 stays loopback-only in practice: its
#     DNAT is 127.0.0.1-locked, so the forward rule for it is an inert superset)
#   - hub spoke-to-spoke forwarding (wg0<->wg0) + Docker-bridge egress preserved
ssh_allowed_cidrs: []   # [] = SSH from anywhere; security is key-only auth
# Only WireGuard is public (it carries the whole management overlay). No public TCP.
common_public_tcp_ports: []
common_public_udp_ports: [51820]
# Platform ports, overlay-only. Fleet-wide telemetry ingest (Loki/Prometheus) is
# open to the whole /24; operator-only dashboards/secrets are scoped to the
# workstation. Mirrors the current live wg0-scoped input rules, now enforced on
# the forward (DNAT) path too so public reach is actually closed.
common_restricted_tcp_rules:
  - { ports: [3100, 9090], cidrs: ['10.20.0.0/24'], interface: wg0 }
  - { ports: [8200, 3000, 9093], cidrs: ['10.20.0.2/32'], interface: wg0 }
# Bridge host: containers must be able to egress (Prometheus scrape, blackbox).
common_docker_bridge_forwarding: true
# Hub: forward traffic between overlay spokes (wg0 <-> wg0).
common_management_forwarding_enabled: true
