stages:
  - lint

# Legacy production deploy/verify jobs were removed intentionally. This CI file
# is validation-only until the protected fleetctl deployment runner exists.

variables:
  ANSIBLE_FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install 'ansible-core>=2.18,<2.19' ansible-lint yamllint
    - ansible-galaxy collection install -r requirements.yml
    - make check STATIC_INVENTORY=examples/static-check-inventory.yml
    - make lint STATIC_INVENTORY=examples/static-check-inventory.yml
