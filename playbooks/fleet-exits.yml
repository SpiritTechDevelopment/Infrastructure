---
- name: Select active exit hosts
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Register enabled exits
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: active_exit_deploy
      loop: "{{ groups['exit'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false

- name: Deploy exit nodes without access hardening
  hosts: active_exit_deploy
  become: true
  serial: "{{ fleet_serial | default('100%') }}"
  any_errors_fatal: true
  pre_tasks:
    - name: Validate exit prerequisites
      ansible.builtin.assert:
        that:
          - reality_server_names | length > 0
          - reality_short_ids | length > 0
          - mask_tls_certificate is defined
          - mask_tls_private_key is defined
          - entry_service_uuid is defined
          - entry_service_uuid | length == 36
          - control_plane_host != 'REPLACE_PLATFORM_PUBLIC_IP'
          - xray_enable_api | bool
          - xray_api_bind | length > 0
          - xray_api_bind not in ['0.0.0.0', '::'] or xray_api_public_mode | bool
          - not common_manage_deploy_user | bool
          - not common_remove_legacy_sshd_dropin | bool
          - not common_manage_sshd | bool
          - not docker_manage_daemon_config | bool
          - not docker_remove_legacy_no_new_privileges | bool
          - not common_manage_firewall | bool
          - not common_enable_fail2ban | bool
          - not management_wireguard_enabled | bool
        fail_msg: >-
          Exit runtime variables are incomplete, or a disabled access-control feature
          was enabled. Public API binding requires xray_api_public_mode=true.
      no_log: true
  roles:
    - {role: common, tags: [common, runtime]}
    - {role: node_limits, tags: [limits, cake, runtime]}
    - {role: docker, tags: [docker, runtime]}
    - {role: xray, tags: [xray, vpn, api]}
    - {role: nginx_mask, tags: [nginx, mask]}
    - {role: node_exporter, tags: [metrics]}
    - {role: alloy, tags: [observability, logs, metrics]}
    - {role: vpn_stack, tags: [stack]}
  post_tasks:
    - name: Mark exit deployment complete
      ansible.builtin.set_fact:
        exit_deploy_complete: true

- name: Gate entry wiring on a complete exit deployment
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Find incomplete enabled exits
      ansible.builtin.set_fact:
        _exit_failed_hosts: "{{ (_exit_failed_hosts | default([])) + [item] }}"
      loop: "{{ groups['active_exit_deploy'] | default([]) }}"
      when: not (hostvars[item].exit_deploy_complete | default(false) | bool)

    - name: Require complete exit deployment
      ansible.builtin.assert:
        that:
          - (_exit_failed_hosts | default([]) | length) == 0
        fail_msg: >-
          Exit deployment did not complete on:
          {{ _exit_failed_hosts | default([]) | join(', ') }}.
          Entry wiring and deployment were not started.
