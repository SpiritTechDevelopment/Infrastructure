---
- name: Test REALITY key output parsers without touching any server
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
    _private_expected: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    _public_expected: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
    _legacy_private_expected: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
    _legacy_public_expected: DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD
    _private_regex: '(?im)^[ \t]*(?:PrivateKey|Private[ \t]+key)[ \t]*[:=][ \t]*([A-Za-z0-9_-]{43})[ \t]*$'
    _public_regex: '(?im)^[ \t]*(?:Password(?:[ \t]*[(][ \t]*Public[ \t]*Key[ \t]*[)])?|Public[ \t]*Key)[ \t]*[:=][ \t]*([A-Za-z0-9_-]{43})[ \t]*$'
    _modern_stdout: |-
      PrivateKey: {{ _private_expected }}
      Password (PublicKey): {{ _public_expected }}
      Hash32: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
    _modern_stderr: ""
    _stderr_only_stdout: ""
    _stderr_only_stderr: |-
      PrivateKey: {{ _private_expected }}
      Password: {{ _public_expected }}
      Hash32: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
    _legacy_stdout: |-
      Private key: {{ _legacy_private_expected }}
      Public key: {{ _legacy_public_expected }}
    _legacy_stderr: ""
  tasks:
    - name: Parse modern Xray output
      ansible.builtin.set_fact:
        _modern_private: >-
          {{ [
               (((_modern_stdout | default('')) | regex_findall(_private_regex) | first) | default('', true)),
               (((_modern_stderr | default('')) | regex_findall(_private_regex) | first) | default('', true))
             ] | select | first | default('', true) }}
        _modern_public: >-
          {{ [
               (((_modern_stdout | default('')) | regex_findall(_public_regex) | first) | default('', true)),
               (((_modern_stderr | default('')) | regex_findall(_public_regex) | first) | default('', true))
             ] | select | first | default('', true) }}

    - name: Parse output when a runtime writes keys to stderr
      ansible.builtin.set_fact:
        _stderr_private: >-
          {{ [
               (((_stderr_only_stdout | default('')) | regex_findall(_private_regex) | first) | default('', true)),
               (((_stderr_only_stderr | default('')) | regex_findall(_private_regex) | first) | default('', true))
             ] | select | first | default('', true) }}
        _stderr_public: >-
          {{ [
               (((_stderr_only_stdout | default('')) | regex_findall(_public_regex) | first) | default('', true)),
               (((_stderr_only_stderr | default('')) | regex_findall(_public_regex) | first) | default('', true))
             ] | select | first | default('', true) }}

    - name: Parse legacy Xray output
      ansible.builtin.set_fact:
        _legacy_private: >-
          {{ [
               (((_legacy_stdout | default('')) | regex_findall(_private_regex) | first) | default('', true)),
               (((_legacy_stderr | default('')) | regex_findall(_private_regex) | first) | default('', true))
             ] | select | first | default('', true) }}
        _legacy_public: >-
          {{ [
               (((_legacy_stdout | default('')) | regex_findall(_public_regex) | first) | default('', true)),
               (((_legacy_stderr | default('')) | regex_findall(_public_regex) | first) | default('', true))
             ] | select | first | default('', true) }}

    - name: Require all parser variants to return the correct keys
      ansible.builtin.assert:
        that:
          - _modern_private == _private_expected
          - _modern_public == _public_expected
          - _stderr_private == _private_expected
          - _stderr_public == _public_expected
          - _legacy_private == _legacy_private_expected
          - _legacy_public == _legacy_public_expected
        fail_msg: "REALITY key output parser regression detected."
