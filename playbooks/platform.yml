---
- name: Deploy platform services without access hardening
  hosts: platform
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Validate platform prerequisites
      ansible.builtin.assert:
        that:
          - control_plane_host is defined
          - control_plane_host | length > 0
          - control_plane_host != 'REPLACE_PLATFORM_PUBLIC_IP'
          - platform_bind_address is defined
          - platform_bind_address | length > 0
          - (not (vault_tls_enabled | bool)) or ((vault_tls_certificate | default('')) | length > 0)
          - (not (vault_tls_enabled | bool)) or ((vault_tls_private_key | default('')) | length > 0)
          - grafana_admin_password is defined
          - grafana_admin_password | length >= 20
          - not common_manage_deploy_user | bool
          - not common_remove_legacy_sshd_dropin | bool
          - not common_manage_sshd | bool
          - not docker_manage_daemon_config | bool
          - not docker_remove_legacy_no_new_privileges | bool
          - not common_manage_firewall | bool
          - not common_enable_fail2ban | bool
          - not management_wireguard_enabled | bool
        fail_msg: >-
          Platform functional deployment requires public control-plane addressing and valid local
          secrets. SSH/firewall/fail2ban/WireGuard controls must remain disabled.
      no_log: false
  roles:
    - {role: common, tags: [common, runtime]}
    - {role: docker, tags: [docker, runtime]}
    - {role: vault, tags: [vault, secrets]}
    - {role: observability, tags: [observability, logs, metrics]}
  post_tasks:
    - name: Mark platform deployment complete
      ansible.builtin.set_fact:
        platform_deploy_complete: true

- name: Gate later phases on a complete platform deployment
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Find incomplete platform hosts
      ansible.builtin.set_fact:
        _platform_failed_hosts: "{{ (_platform_failed_hosts | default([])) + [item] }}"
      loop: "{{ groups['platform'] | default([]) }}"
      when: not (hostvars[item].platform_deploy_complete | default(false) | bool)

    - name: Require complete platform deployment
      ansible.builtin.assert:
        that:
          - (_platform_failed_hosts | default([]) | length) == 0
        fail_msg: >-
          Platform deployment did not complete on:
          {{ _platform_failed_hosts | default([]) | join(', ') }}.
          Later fleet phases were not started.
