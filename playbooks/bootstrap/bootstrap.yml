---
- name: Bootstrap clean SpiritVPN VPS hosts from compiled plans
  hosts: spiritvpn_bootstrap
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    spiritvpn_deploy_mode: bootstrap
    spiritvpn_manage_deploy_user: true
    spiritvpn_require_runtime_secrets: false
    pki_agent_require_certificate: true
  pre_tasks:
    - name: Load and validate the compiled bootstrap node plan
      ansible.builtin.include_role:
        name: compiled_node_plan
  roles:
    - role: docker
    - role: common
    - role: node_layout
    - role: bootstrap_wireguard
    - role: node_limits
    - role: pki_agent
  # This play connected on the default port because that is all a clean VPS
  # answers on; the common role has since moved sshd to the compiled port and
  # closed the old one in nftables. The current session survives on conntrack,
  # a new one would not — so hand the port over explicitly here instead of
  # trusting handler ordering, and drop the connection before readiness.yml
  # opens its own.
  post_tasks:
    - name: Reload sshd onto the compiled port before handing the connection over
      ansible.builtin.meta: flush_handlers

    - name: Point later plays at the compiled sshd port
      ansible.builtin.set_fact:
        ansible_port: "{{ spiritvpn_node_plan.infrastructure.networking.ssh.port }}"

    - name: Drop the bootstrap-port connection
      ansible.builtin.meta: reset_connection

- name: Run read-only bootstrap readiness checks
  ansible.builtin.import_playbook: readiness.yml
