---
# Complete functional deployment. Deliberately excludes WireGuard, nftables,
# fail2ban, sshd hardening, and private-network-only bindings.
- name: Validate inventory before deployment
  import_playbook: preflight.yml

- name: Deploy platform services
  import_playbook: platform.yml

- name: Deploy exit nodes
  import_playbook: fleet-exits.yml

- name: Derive and publish entry-to-exit wiring
  import_playbook: wire-fleet.yml

- name: Deploy entry nodes
  import_playbook: fleet-entries.yml

- name: Export backend client metadata
  import_playbook: client-metadata.yml

- name: Verify the complete deployment
  import_playbook: verify.yml
