---
- name: Select active fleet hosts for verification
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Register enabled fleet nodes
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: active_fleet_verify
      loop: "{{ (groups['entry'] | default([])) + (groups['exit'] | default([])) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false

- name: Verify every VPN node and its public endpoints
  hosts: active_fleet_verify
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read running VPN Compose services
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/vpn/compose.yml
          - ps
          - --services
          - --status
          - running
      register: _vpn_services
      changed_when: false

    - name: Require all VPN services to be running
      ansible.builtin.assert:
        that:
          - "'xray' in _vpn_services.stdout_lines"
          - "'nginx-mask' in _vpn_services.stdout_lines"
          - "'node-exporter' in _vpn_services.stdout_lines"
          - "'alloy' in _vpn_services.stdout_lines"
        fail_msg: "One or more /opt/vpn services are not running on {{ inventory_hostname }}."

    - name: Exercise the local Xray gRPC API
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/vpn/compose.yml
          - exec
          - -T
          - xray
          - xray
          - api
          - statsquery
          - "--server=127.0.0.1:{{ xray_api_port }}"
      register: _xray_api_local
      changed_when: false

    - name: Verify the Xray diagnostic metrics endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ xray_metrics_port }}/debug/vars"
        return_content: true
        status_code: 200
      register: _xray_metrics
      retries: 10
      delay: 2
      until: _xray_metrics.status == 200

    - name: Verify the local TLS mask endpoint
      ansible.builtin.uri:
        url: https://{{ mask_bind_address }}:{{ mask_port }}/
        validate_certs: false
        status_code: 200
      register: _mask_health
      retries: 10
      delay: 2
      until: _mask_health.status == 200

    - name: Wait for public VLESS port from the deployment controller
      ansible.builtin.wait_for:
        host: "{{ public_hostname | default(ansible_host) }}"
        port: "{{ public_port | default(443) }}"
        timeout: 30
      delegate_to: localhost
      become: false

    - name: Wait for the Xray API port from the deployment controller (over the overlay)
      ansible.builtin.wait_for:
        host: "{{ xray_api_overlay_host | default(xray_api_public_host | default(ansible_host)) }}"
        port: "{{ xray_api_port }}"
        timeout: 30
      delegate_to: localhost
      become: false

- name: Verify platform health, dashboards, logs, and metrics end to end
  hosts: platform
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../roles/observability/defaults/main.yml
    - ../roles/vault/defaults/main.yml
  vars:
    _expected_telemetry_nodes: >-
      {{ (groups['active_fleet_verify'] | default([])) + [inventory_hostname] }}
  tasks:
    - name: Verify Loki readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ loki_port }}/ready"
        status_code: 200
      register: _loki_ready
      retries: 20
      delay: 3
      until: _loki_ready.status == 200

    - name: Verify Prometheus readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/ready"
        status_code: 200
      register: _prom_ready
      retries: 20
      delay: 3
      until: _prom_ready.status == 200

    - name: Verify Alertmanager readiness
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ alertmanager_port }}/-/ready"
        status_code: 200
      register: _alert_ready
      retries: 20
      delay: 3
      until: _alert_ready.status == 200

    - name: Verify Grafana health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/health"
        status_code: 200
        return_content: true
      register: _grafana_health
      retries: 20
      delay: 3
      until: _grafana_health.status == 200

    - name: Verify each provisioned Grafana dashboard by stable UID
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ grafana_port }}/api/dashboards/uid/{{ item }}"
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
        return_content: true
      loop:
        - vpn-fleet-overview
        - vpn-logs
      register: _grafana_dashboard
      no_log: true
      retries: 10
      delay: 3
      until: _grafana_dashboard.status == 200

    - name: Verify Vault process health even if still sealed or uninitialized
      ansible.builtin.uri:
        url: "{{ 'https' if vault_tls_enabled | bool else 'http' }}://127.0.0.1:{{ vault_api_port }}/v1/sys/health"
        validate_certs: false
        status_code: [200, 429, 472, 473, 501, 503]
        return_content: true
      register: _vault_health
      retries: 20
      delay: 3
      until: _vault_health.status in [200, 429, 472, 473, 501, 503]

    - name: Wait until Prometheus contains every node's node_exporter metrics
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query=node_uname_info"
        status_code: 200
        return_content: true
      register: _prom_nodes
      retries: 30
      delay: 4
      until: >-
        (_prom_nodes.json.data.result | default([])
         | map(attribute='metric.instance') | list
         | intersect(_expected_telemetry_nodes) | length)
        == (_expected_telemetry_nodes | length)

    - name: Wait until every public customer endpoint is reachable from Prometheus
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query={{
          'sum(probe_success{service="vless"})' | urlencode }}
        status_code: 200
        return_content: true
      register: _customer_probe
      retries: 20
      delay: 4
      until: >-
        ((_customer_probe.json.data.result | default([]) | first | default({})).value
         | default([0, 0]) | last | int)
        == (groups['active_fleet_verify'] | default([]) | length)

    - name: Wait until every public Xray API is reachable from Prometheus
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ prometheus_port }}/api/v1/query?query={{
          'sum(probe_success{service="xray-api"})' | urlencode }}
        status_code: 200
        return_content: true
      register: _api_probe
      retries: 20
      delay: 4
      until: >-
        ((_api_probe.json.data.result | default([]) | first | default({})).value
         | default([0, 0]) | last | int)
        == (groups['active_fleet_verify'] | default([]) | length)

    - name: Wait until Loki contains logs from every node
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ loki_port }}/loki/api/v1/label/node/values"
        headers:
          X-Scope-OrgID: ops
        status_code: 200
        return_content: true
      register: _loki_nodes
      retries: 30
      delay: 4
      until: >-
        ((_loki_nodes.json.data | default([]))
         | intersect(_expected_telemetry_nodes) | length)
        == (_expected_telemetry_nodes | length)

    - name: Wait until Loki contains Xray logs from every VPN node
      ansible.builtin.uri:
        url: >-
          http://127.0.0.1:{{ loki_port }}/loki/api/v1/query_range?query={{
          ('{node="' ~ item ~ '",container=~".*xray.*"}') | urlencode
          }}&limit=1&since=30m
        headers:
          X-Scope-OrgID: ops
        status_code: 200
        return_content: true
      loop: "{{ groups['active_fleet_verify'] | default([]) }}"
      register: _loki_xray_logs
      retries: 30
      delay: 4
      until: (_loki_xray_logs.json.data.result | default([]) | length) > 0

    - name: Deployment verification summary
      ansible.builtin.debug:
        msg:
          - "All public Xray API endpoints are reachable from the controller."
          - "Xray, mask, Alloy and node_exporter are running on every active VPN node."
          - "Grafana dashboards are provisioned, including customer and API reachability."
          - "Prometheus has metrics from: {{ _expected_telemetry_nodes | join(', ') }}"
          - "Loki has logs from: {{ _expected_telemetry_nodes | join(', ') }}"
