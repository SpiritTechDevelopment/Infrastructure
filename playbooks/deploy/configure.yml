---
- name: Configure SpiritVPN nodes only from compiled artifacts
  hosts: spiritvpn_fleet
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  pre_tasks:
    - name: Load and validate the compiled node plan before mutation
      ansible.builtin.include_role:
        name: compiled_node_plan
  roles:
    - role: common
    - role: docker
    # Bootstrap writes the first copy, but every steady-state reconciliation
    # must replace it with the exact compiled plan for this deployment. Without
    # this role the on-host audit artifact silently freezes at bootstrap time.
    - role: node_layout
    - role: node_limits
    - role: xray
    - role: nginx_mask
    - role: node_exporter
    - role: node_agent
    - role: compiled_runtime
