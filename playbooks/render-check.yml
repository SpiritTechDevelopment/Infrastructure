---
- name: Build offline entry wiring for render validation
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
    _dummy_reality_password: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE"
  tasks:
    - name: Build dummy-key outbounds from enabled exits
      ansible.builtin.set_fact:
        _render_entry_exits: >-
          {{ _render_entry_exits | default([]) + [ {
            'tag': hostvars[item].country ~ '-exit',
            'address': hostvars[item].public_hostname | default(hostvars[item].ansible_host),
            'port': hostvars[item].public_port | default(443),
            'uuid': hostvars[item].entry_service_uuid,
            'reality_sni': hostvars[item].reality_server_names[0],
            'reality_password': _dummy_reality_password,
            'reality_short_id': hostvars[item].reality_short_ids[0],
            'email': 'via-' ~ hostvars[item].country,
            'fingerprint': hostvars[item].reality_fingerprint | default('chrome')
          } ] }}
      loop: "{{ groups['exit'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      no_log: true

    - name: Publish offline wiring to enabled entries
      ansible.builtin.add_host:
        name: "{{ item }}"
        entry_exits: "{{ _render_entry_exits | default([]) }}"
      loop: "{{ groups['entry'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false
      no_log: false

- name: Render Xray configuration locally
  hosts: "{{ target | default('entry:exit') }}"
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
    reality_private_key_eff: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA"
  tasks:
    - name: Ensure secure render directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../_render"
        state: directory
        mode: "0700"
      run_once: true

    - name: Render Xray role template only
      ansible.builtin.include_role:
        name: xray
        tasks_from: render_check
      when: node_enabled | default(true) | bool
