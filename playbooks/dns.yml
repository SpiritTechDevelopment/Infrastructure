---
# Reconcile Cloudflare DNS from the inventory (label-driven). Runs locally — it is
# a set of Cloudflare API calls, not a host operation. Plan by default; apply with
# `make dns APPLY=1`. See TOPOLOGY.md and OPERATIONS.md.
- name: Reconcile Cloudflare DNS from the inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    ansible_become: false
  roles:
    - cloudflare_dns
