---
# Host security hardening stage. Runs the deploy_mode-gated hardening in the
# common role. Requires deploy_mode=bootstrap|hardened plus the specific
# common_* flags (set in group_vars or with -e). In runtime mode this is a
# no-op beyond runtime prerequisites.
#
# Examples:
#   Dry-run SSH hardening (zero-diff proof):
#     ansible-playbook -i inventories/prod/inventory.yml playbooks/harden.yml \
#       -e deploy_mode=hardened -e common_manage_sshd=true \
#       --check --diff --limit control-1,exit-fr
#   Apply:
#     (same without --check)
- name: Host security hardening
  hosts: "{{ harden_target | default('all') }}"
  become: true
  gather_facts: true
  vars:
    deploy_mode: "{{ deploy_mode | default('hardened') }}"
  roles:
    - role: common
