---
# Build entry outbounds from the REALITY client passwords derived from deployed exits.
# This playbook is part of site.yml and can also be run independently.

- name: Select active exits and entries for wiring
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Register enabled exits for wiring
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: active_exit_wire
      loop: "{{ groups['exit'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false

    - name: Register enabled entries for wiring
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: active_entry_wire
      loop: "{{ groups['entry'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false

- name: Derive REALITY client passwords from deployed exits
  hosts: active_exit_wire
  become: true
  gather_facts: false
  any_errors_fatal: true
  vars:
    _reality_public_key_output_regex: >-
      (?im)^[ \t]*(?:Password(?:[ \t]*[(][ \t]*Public[ \t]*Key[ \t]*[)])?|Public[ \t]*Key)[ \t]*[:=][ \t]*([A-Za-z0-9_-]{43})[ \t]*$
  tasks:
    - name: Read retained REALITY private key
      ansible.builtin.slurp:
        src: /var/lib/xray/reality.key
      register: _reality_priv
      no_log: true

    - name: Derive the REALITY client password with the deployed Xray image
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - "{{ xray_image }}"
          - x25519
          - -i
          - "{{ _reality_priv.content | b64decode | trim }}"
      register: _reality_pub
      changed_when: false
      no_log: false

    - name: Extract the explicitly labelled REALITY client password
      ansible.builtin.set_fact:
        _reality_priv_value: "{{ _reality_priv.content | b64decode | trim }}"
        reality_password_readback: >-
          {{ [
               (
                 ((_reality_pub.stdout | default(''))
                   | regex_findall(_reality_public_key_output_regex)
                   | first)
                 | default('', true)
               ),
               (
                 ((_reality_pub.stderr | default(''))
                   | regex_findall(_reality_public_key_output_regex)
                   | first)
                 | default('', true)
               )
             ] | select | first | default('', true) }}
      no_log: true

    - name: Validate the derived REALITY client password
      ansible.builtin.assert:
        that:
          - reality_password_readback | length == 43
          - reality_password_readback is match('^[A-Za-z0-9_-]{43}$')
          - reality_password_readback != _reality_priv_value
        fail_msg: >-
          Could not derive a valid REALITY client password for {{ inventory_hostname }}.
          Refusing to generate entry routing with a missing/private key.
      no_log: true

    - name: Mark this exit as successfully read for wiring
      ansible.builtin.set_fact:
        reality_wiring_readback_ok: true

- name: Gate entry wiring on successful readback from every enabled exit
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Find exits without a successful REALITY readback
      ansible.builtin.set_fact:
        _wire_failed_exits: "{{ (_wire_failed_exits | default([])) + [item] }}"
      loop: "{{ groups['active_exit_wire'] | default([]) }}"
      when: not (hostvars[item].reality_wiring_readback_ok | default(false) | bool)

    - name: Require every enabled exit before building entry routing
      ansible.builtin.assert:
        that:
          - (_wire_failed_exits | default([]) | length) == 0
        fail_msg: >-
          Cannot build entry routing because these exits were not deployed/readable:
          {{ _wire_failed_exits | default([]) | join(', ') }}.

- name: Assemble and publish entry wiring
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
    wire_inventory_dir: "{{ ansible_inventory_sources | first | dirname }}"
  tasks:
    - name: Require at least one active exit and entry
      ansible.builtin.assert:
        that:
          - groups['active_exit_wire'] | default([]) | length > 0
          - groups['active_entry_wire'] | default([]) | length > 0
        fail_msg: "At least one enabled exit and one enabled entry are required."

    - name: Validate wiring inputs for every enabled exit
      ansible.builtin.assert:
        that:
          - hostvars[item].reality_password_readback is defined
          - hostvars[item].reality_password_readback | length == 43
          - hostvars[item].country is defined
          - hostvars[item].entry_service_uuid is defined
          - hostvars[item].reality_server_names | length > 0
          - hostvars[item].reality_short_ids | length > 0
        fail_msg: >-
          Missing validated wiring data for {{ item }}. The exit deployment/readback
          phase must succeed before entry routing can be generated.
      loop: "{{ groups['active_exit_wire'] }}"

    - name: Build the shared exit outbound list
      ansible.builtin.set_fact:
        _entry_exits: "{{ _entry_exits | default([]) + [ {
          'tag': hostvars[item].country ~ '-exit',
          'address': hostvars[item].public_hostname | default(hostvars[item].ansible_host),
          'port': hostvars[item].public_port | default(443),
          'uuid': hostvars[item].entry_service_uuid,
          'reality_sni': hostvars[item].reality_server_names[0],
          'reality_password': hostvars[item].reality_password_readback,
          'reality_short_id': hostvars[item].reality_short_ids[0],
          'email': 'via-' ~ hostvars[item].country,
          'fingerprint': hostvars[item].reality_fingerprint | default('chrome')
        } ] }}"
      loop: "{{ groups['active_exit_wire'] }}"
      no_log: true

    - name: Validate every enabled exit was wired
      ansible.builtin.assert:
        that:
          - _entry_exits | length == groups['active_exit_wire'] | length
          - (_entry_exits | map(attribute='tag') | list | unique | length) == (_entry_exits | length)
        fail_msg: "Exit wiring is incomplete or contains duplicate country tags."

    - name: Publish generated wiring to the current Ansible run
      ansible.builtin.add_host:
        name: "{{ item }}"
        entry_exits: "{{ _entry_exits }}"
      loop: "{{ groups['active_entry_wire'] }}"
      changed_when: false
      no_log: true

    - name: Create per-entry host_vars directories
      ansible.builtin.file:
        path: "{{ wire_inventory_dir }}/host_vars/{{ item }}"
        state: directory
        mode: "0700"
      loop: "{{ groups['active_entry_wire'] }}"

    - name: Persist generated wiring for future standalone runs
      ansible.builtin.copy:
        dest: "{{ wire_inventory_dir }}/host_vars/{{ item }}/generated_exits.yml"
        content: "{{ {'entry_exits': _entry_exits} | to_nice_yaml(indent=2) }}"
        mode: "0600"
      loop: "{{ groups['active_entry_wire'] }}"
      no_log: true

    - name: Report generated routing
      ansible.builtin.debug:
        msg: >-
          Wired {{ _entry_exits | length }} exits into
          {{ groups['active_entry_wire'] | join(', ') }}.
