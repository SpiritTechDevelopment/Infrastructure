---
# Deploy / reconcile the WireGuard management overlay (wg0, 10.20.0.0/24,
# hub-and-spoke; hub = control-1). Run over the WHOLE management_network group,
# never with --limit — the hub's peer list must include every active host (the
# role asserts this). Keys are generated on-node once and reused; the role never
# regenerates an existing key, so re-runs are idempotent.
#
# ⚠ Touches the live management fabric: a config change restarts wg-quick@wg0
# (brief overlay/telemetry blip; the data plane is unaffected). Keep provider
# console access ready. Dry-run first: add --check.
- name: Deploy the WireGuard management overlay
  hosts: management_network
  become: true
  gather_facts: true
  vars:
    management_wireguard_enabled: true
  roles:
    - management_wireguard
