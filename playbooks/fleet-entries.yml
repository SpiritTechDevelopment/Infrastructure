---
- name: Select active entry hosts
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Register enabled entries
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: active_entry_deploy
      loop: "{{ groups['entry'] | default([]) }}"
      when: hostvars[item].node_enabled | default(true) | bool
      changed_when: false

- name: Deploy entry nodes after exit wiring
  hosts: active_entry_deploy
  become: true
  serial: "{{ fleet_serial | default('100%') }}"
  any_errors_fatal: true
  pre_tasks:
    - name: Validate entry prerequisites and default route
      ansible.builtin.assert:
        that:
          - reality_server_names | length > 0
          - reality_short_ids | length > 0
          - mask_tls_certificate is defined
          - mask_tls_private_key is defined
          - entry_exits | length > 0
          - entry_default_exit_tag | length > 0
          - entry_default_exit_tag in (entry_exits | map(attribute='tag') | list)
          - control_plane_host != 'REPLACE_PLATFORM_PUBLIC_IP'
          - xray_enable_api | bool
          - xray_api_bind | length > 0
          - xray_api_bind not in ['0.0.0.0', '::'] or xray_api_public_mode | bool
          - not common_manage_deploy_user | bool
          - not common_remove_legacy_sshd_dropin | bool
          - not common_manage_sshd | bool
          - not docker_manage_daemon_config | bool
          - not docker_remove_legacy_no_new_privileges | bool
          - not common_manage_firewall | bool
          - not common_enable_fail2ban | bool
          - not management_wireguard_enabled | bool
        fail_msg: >-
          Entry wiring is incomplete or the declared default exit does not exist.
          Deploy exits and run wire-fleet before deploying entries.
      no_log: false
  roles:
    - {role: common, tags: [common, runtime]}
    - {role: docker, tags: [docker, runtime]}
    - {role: xray, tags: [xray, vpn, api]}
    - {role: nginx_mask, tags: [nginx, mask]}
    - {role: node_exporter, tags: [metrics]}
    - {role: alloy, tags: [observability, logs, metrics]}
    - {role: vpn_stack, tags: [stack]}
  post_tasks:
    - name: Mark entry deployment complete
      ansible.builtin.set_fact:
        entry_deploy_complete: true

- name: Gate metadata and verification on a complete entry deployment
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_become: false
  tasks:
    - name: Find incomplete enabled entries
      ansible.builtin.set_fact:
        _entry_failed_hosts: "{{ (_entry_failed_hosts | default([])) + [item] }}"
      loop: "{{ groups['active_entry_deploy'] | default([]) }}"
      when: not (hostvars[item].entry_deploy_complete | default(false) | bool)

    - name: Require complete entry deployment
      ansible.builtin.assert:
        that:
          - (_entry_failed_hosts | default([]) | length) == 0
        fail_msg: >-
          Entry deployment did not complete on:
          {{ _entry_failed_hosts | default([]) | join(', ') }}.
          Metadata export and verification were not started.
