---
- name: Reconcile the management foundation from a reviewed Git commit
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    deploy_mode: hardened
    common_manage_deploy_user: true
    common_authorized_keys: "{{ platform_operator_ssh_public_keys }}"
    common_manage_sshd: true
    common_manage_firewall: true
    common_enable_fail2ban: true
    common_manage_sysctl: true
    common_enable_unattended_upgrades: true
    common_enable_auditd: true
    common_public_tcp_ports: []
    common_public_udp_ports: ["{{ platform_wireguard_listen_port }}"]
    common_trusted_interfaces: ["{{ platform_wireguard_interface }}"]
    # Мосты Docker: control-стек единственный здесь живёт не в сети хоста, и
    # его контейнерам нужен исходящий трафик наружу. Имена мостов генерирует
    # Docker, поэтому шаблон, а не перечисление.
    common_container_egress_interfaces: ["docker0", "br-*"]
    # Обратное направление: контейнеры контура control дозваниваются до
    # бэкенда по адресу хаба в оверлее, потому что его порт опубликован на
    # management-адресе, а не на мосту. С включённым userland-proxy DNAT не
    # происходит, адрес назначения остаётся локальным, и пакет приходит в
    # input с моста — где не совпадал ни с одним правилом и умирал о policy
    # drop. Стоило это отказов на оплаченных заказах: бот получал таймаут, а
    # тот же вызов с хоста проходил мгновенно.
    #
    # forward_ports названы отдельно и равны порту внутри контейнера: при
    # выключенном userland-proxy тот же пакет проходит DNAT до фильтрации и
    # уходит уже в forward с портом 8443. Так правило не зависит от настройки
    # демона, вместо того чтобы случайно ей соответствовать.
    #
    # Подсеть — весь частный пул Docker, а не адрес конкретного моста. Адреса
    # мостам раздаёт Docker; закрепить их можно только через ipam, а смена
    # ipam на живой сети означает её пересоздание, то есть простой контура.
    # Граница доверия здесь и так проходит по «контейнеры на мостах этого
    # хоста», и iifname "br-*" выражает её точнее любого адреса.
    common_restricted_tcp_rules:
      - ports: [9443]
        forward_ports: [8443]
        cidrs: ["172.16.0.0/12"]
        interface: "br-*"
    ssh_allowed_cidrs: "{{ platform_ssh_allowed_cidrs }}"
    common_fail2ban_ignoreip: >-
      127.0.0.1/8 ::1 {{ platform_fail2ban_ignore_cidrs | default([]) | join(' ') }}
  pre_tasks:
    - name: Require the persisted bootstrap contract
      ansible.builtin.assert:
        that:
          - platform_operator_ssh_public_keys | default([]) | length > 0
          - platform_github_ssh_keys | default([]) | length > 0
          - platform_ssh_allowed_cidrs | default([]) | length > 0
          - platform_wireguard_operator_peers | default([]) | length > 0
          - platform_wireguard_hub_addresses | default({}) | length > 0
          - platform_wireguard_public_endpoint is match('^[A-Za-z0-9.:[\]-]+:[0-9]{1,5}$')
        fail_msg: "The protected management runtime configuration is incomplete."
  roles:
    - role: platform_wireguard
    - role: docker
    - role: common
    - role: platform_vault
    - role: platform_executor
    # One shared collector for every environment, like one shared Vault.
    # Isolation is by write surface: each environment's control deployment
    # writes only its own file_sd fragments.
    - role: platform_observability

- name: Verify Vault after management reconciliation
  ansible.builtin.import_playbook: readiness.yml
  vars:
    platform_readiness_hosts: localhost
