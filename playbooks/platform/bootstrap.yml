---
- name: Install the v1 management foundation from the minimal bootstrap inventory
  hosts: spiritvpn_platform_bootstrap
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    deploy_mode: bootstrap
    common_manage_deploy_user: true
    common_authorized_keys: "{{ platform_operator_ssh_public_keys }}"
    common_manage_sshd: true
    common_manage_firewall: true
    common_enable_fail2ban: true
    common_manage_sysctl: true
    common_enable_unattended_upgrades: true
    common_enable_auditd: true
    common_public_tcp_ports: []
    common_public_udp_ports: []
    ssh_allowed_cidrs: "{{ platform_ssh_allowed_cidrs }}"
    common_fail2ban_ignoreip: >-
      127.0.0.1/8 ::1 {{ platform_ssh_allowed_cidrs | join(' ') }}
  pre_tasks:
    - name: Require explicit non-secret operator inputs
      ansible.builtin.assert:
        that:
          - platform_operator_ssh_public_keys | default([]) | length > 0
          - platform_github_ssh_keys | default([]) | length > 0
          - platform_ssh_allowed_cidrs | default([]) | length > 0
          - >-
            platform_vault_image | default('') is
            match('^[A-Za-z0-9][A-Za-z0-9./:_-]*@sha256:[0-9a-f]{64}$')
        fail_msg: >-
          Bootstrap requires reviewed operator/GitHub public keys, explicit SSH
          source CIDRs and a Vault image pinned by digest.
  roles:
    - role: docker
    - role: common
    - role: platform_vault
    - role: platform_executor

- name: Verify the installed Vault process without initializing or unsealing it
  ansible.builtin.import_playbook: readiness.yml
