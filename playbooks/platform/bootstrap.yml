---
- name: Install the v1 management foundation from the minimal bootstrap inventory
  hosts: spiritvpn_platform_bootstrap
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    deploy_mode: bootstrap
    common_manage_deploy_user: true
    common_authorized_keys: "{{ platform_operator_ssh_public_keys }}"
    common_manage_sshd: true
    common_manage_firewall: true
    common_enable_fail2ban: true
    common_manage_sysctl: true
    common_enable_unattended_upgrades: true
    common_enable_auditd: true
    common_public_tcp_ports: []
    common_public_udp_ports: ["{{ platform_wireguard_listen_port }}"]
    # Оверлей больше не доверен целиком. Раньше `iifname wg0 accept`
    # срабатывал раньше любого правила по адресу, поэтому на хабе нельзя было
    # ограничить ни один порт: до всего, что слушает оверлейный адрес,
    # дотягивалась каждая нода флота — а ноды стоят в интернете. Теперь вход
    # объявлен поимённо, а транзит оператор → хаб → нода живёт отдельно.
    common_trusted_interfaces: []
    common_forward_interfaces: ["{{ platform_wireguard_interface }}"]
    # То же, что в steady.yml: расхождение между bootstrap и steady означало бы
    # хаб, у которого выход из контейнеров то появляется, то пропадает.
    common_container_egress_interfaces: ["docker0", "br-*"]
    # То же и по той же причине, что в steady.yml: обоснование там.
    # Источники берутся из самого контракта, а не перечисляются здесь: список,
    # который ведут руками, расходится с ростером ровно в тот момент, когда
    # оператора добавили, а сюда дописать забыли.
    platform_operator_overlay_cidrs: >-
      {{ platform_wireguard_operator_peers
         | map(attribute='allowed_ips') | flatten | list }}
    platform_runner_overlay_cidrs: >-
      {{ platform_wireguard_runner_peers | default([])
         | map(attribute='address') | list }}
    platform_overlay_networks: >-
      {{ platform_wireguard_environment_networks.values() | list }}
    common_restricted_tcp_rules:
      - ports: [9443]
        forward_ports: [8443]
        cidrs: ["172.16.0.0/12"]
        interface: "br-*"
      # SSH из оверлея: операторы и раннер. Раннер ходит сюда форсированной
      # командой, оператор — обычной сессией; оба только через оверлей.
      - ports: "{{ common_ssh_ports }}"
        cidrs: "{{ platform_operator_overlay_cidrs + platform_runner_overlay_cidrs }}"
        interface: "{{ platform_wireguard_interface }}"
      # Grafana и Vault UI — только операторам. Ноды в этот список не входят.
      - ports: ["{{ platform_grafana_port }}", "{{ platform_vault_api_port }}"]
        cidrs: "{{ platform_operator_overlay_cidrs }}"
        interface: "{{ platform_wireguard_interface }}"
      # Loki принимает логи со всех нод, поэтому здесь сеть целиком. Это
      # единственный порт хаба, открытый всему оверлею, и открыт он на приём
      # записи, а не на чтение.
      - ports: ["{{ platform_loki_port }}"]
        cidrs: "{{ platform_overlay_networks }}"
        interface: "{{ platform_wireguard_interface }}"
    # Grafana слушает управляющий оверлей: операторы достают её оттуда, а не
    # SSH-туннелем. Адрес берётся из контракта; какой именно из адресов хаба —
    # безразлично, они все на одном wg0, и любой операторский peer достаёт
    # каждый. Анонимный доступ при этом обязан быть выключен: ограничить порт
    # firewall'ом на хабе нельзя, потому что wg0 доверен целиком.
    platform_vault_overlay_address: >-
      {{ platform_wireguard_hub_addresses['develop'] | regex_replace('/.*$', '') }}
    platform_grafana_bind_address: >-
      {{ platform_wireguard_hub_addresses['develop'] | regex_replace('/.*$', '') }}
    platform_grafana_anonymous_enabled: false
    ssh_allowed_cidrs: "{{ platform_ssh_allowed_cidrs }}"
    common_fail2ban_ignoreip: >-
      127.0.0.1/8 ::1 {{ platform_fail2ban_ignore_cidrs | default([]) | join(' ') }}
  pre_tasks:
    - name: Require explicit non-secret operator inputs
      ansible.builtin.assert:
        that:
          - platform_operator_ssh_public_keys | default([]) | length > 0
          - platform_github_ssh_keys | default([]) | length > 0
          - platform_ssh_allowed_cidrs | default([]) | length > 0
          - platform_wireguard_operator_peers | default([]) | length > 0
          - platform_wireguard_hub_addresses | default({}) | length > 0
          - platform_wireguard_public_endpoint is match('^[A-Za-z0-9.:[\]-]+:[0-9]{1,5}$')
          - platform_fail2ban_ignore_cidrs | default([]) is sequence
        fail_msg: >-
          Bootstrap requires reviewed SSH keys/CIDRs and at least one operator
          WireGuard peer for clean-host management access.
  roles:
    - role: platform_wireguard
    - role: docker
    - role: common
    - role: platform_vault
    - role: platform_executor

- name: Verify the installed Vault process without initializing or unsealing it
  ansible.builtin.import_playbook: readiness.yml
